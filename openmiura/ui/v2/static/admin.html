<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>openMiura — Admin console</title>
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/JetBrains/JetBrainsMono@v2.304/web/jetbrains-mono.css" />
  <link rel="stylesheet" href="./openmiura.css" />
  <script src="./js/theme.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/icons.js"></script>
  <script src="./js/components.js"></script>
  <script src="./js/shell.js"></script>
  <script src="./js/admin/dashboard.js"></script>
  <script src="./js/admin/runtimes.js"></script>
  <script src="./js/admin/policies.js"></script>
  <script src="./js/admin/secrets.js"></script>
  <script src="./js/admin/identities.js"></script>
  <script src="./js/admin/channels.js"></script>
  <script src="./js/admin/evidence.js"></script>
  <script src="./js/admin/secrets_wizard.js"></script>
  <script src="./js/admin/dispatches.js"></script>
  <script defer src="./js/alpine.min.js"></script>
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="font-sans" x-data="omShell({
  profile: 'admin',
  activeId: 'dashboard',
  breadcrumbs: [
    { label: 'Admin', href: './admin.html' },
    { label: 'Dashboard' }
  ]
})">

  <div class="om-shell" :class="{ 'om-shell--collapsed': sidebarCollapsed }">

    <aside class="om-sidebar bg-surface-0 dark:bg-surface-900 border-r border-surface-200 dark:border-surface-700 flex flex-col"
           :class="{ 'hidden md:flex': !mobileMenuOpen, 'flex': mobileMenuOpen }">
      <div class="px-4 py-4 border-b border-surface-200 dark:border-surface-700 flex items-center gap-3">
        <div class="w-8 h-8 rounded-md bg-primary-900 dark:bg-primary-700 flex items-center justify-center text-surface-0 font-bold text-sm">oM</div>
        <div class="min-w-0">
          <p class="text-sm font-semibold tracking-tight truncate" x-text="profileTitle"></p>
          <p class="text-xs text-surface-500 dark:text-surface-400 truncate" x-text="profileTagline"></p>
        </div>
      </div>

      <nav class="flex-1 overflow-y-auto py-3 space-y-4" aria-label="Admin sections">
        <template x-for="group in groups" :key="group.title">
          <div :aria-labelledby="'group-' + group.title">
            <p :id="'group-' + group.title"
               class="px-4 mb-1 text-[10px] font-semibold uppercase tracking-wider text-surface-500 dark:text-surface-400"
               x-text="group.title"></p>
            <ul>
              <template x-for="item in group.items" :key="item.id">
                <li>
                  <button type="button"
                          class="w-full flex items-center gap-2 px-4 py-2 text-sm transition text-left"
                          :class="isActive(item.id)
                            ? 'bg-primary-50 dark:bg-primary-900/40 text-primary-900 dark:text-accent-300 font-medium border-l-2 border-primary-900 dark:border-accent-400'
                            : 'text-surface-700 dark:text-surface-300 hover:bg-surface-100 dark:hover:bg-surface-800 border-l-2 border-transparent'"
                          :aria-current="isActive(item.id) ? 'page' : 'false'"
                          @click="setActive(item.id)">
                    <span x-html="omIcon(item.icon, 'w-4 h-4 shrink-0')" aria-hidden="true"></span>
                    <span x-text="item.label" class="truncate"></span>
                  </button>
                </li>
              </template>
            </ul>
          </div>
        </template>
      </nav>

      <div class="px-4 py-3 border-t border-surface-200 dark:border-surface-700 text-xs text-surface-500 dark:text-surface-400">
        <p>openMiura UI v2</p>
        <p class="font-mono">phase/ui-a2</p>
      </div>
    </aside>

    <header class="om-topbar bg-surface-0 dark:bg-surface-900 border-b border-surface-200 dark:border-surface-700 flex items-center px-4 gap-3">
      <button type="button"
              class="md:hidden p-1.5 rounded-md text-surface-700 dark:text-surface-200 hover:bg-surface-100 dark:hover:bg-surface-800"
              @click="toggleMobileMenu()" aria-label="Toggle menu">
        <span class="block w-5 h-0.5 bg-current mb-1"></span>
        <span class="block w-5 h-0.5 bg-current mb-1"></span>
        <span class="block w-5 h-0.5 bg-current"></span>
      </button>

      <nav aria-label="Breadcrumb" class="flex-1 overflow-x-auto min-w-0">
        <ol class="flex items-center gap-2 text-sm whitespace-nowrap">
          <template x-for="(crumb, i) in breadcrumbs" :key="i">
            <li class="flex items-center gap-2">
              <span x-show="i > 0" class="text-surface-400 dark:text-surface-600">/</span>
              <template x-if="crumb.href">
                <a :href="crumb.href" class="text-accent-700 dark:text-accent-300 hover:underline" x-text="crumb.label"></a>
              </template>
              <template x-if="!crumb.href">
                <span class="text-surface-700 dark:text-surface-200" :class="i === breadcrumbs.length - 1 ? 'font-medium' : ''" x-text="crumb.label"></span>
              </template>
            </li>
          </template>
        </ol>
      </nav>

      <div class="relative" x-data="omAuthPanel()">
        <button type="button"
                class="inline-flex items-center gap-2 px-2 py-1 rounded-md text-xs font-medium border border-surface-300 dark:border-surface-600 text-surface-700 dark:text-surface-200 hover:bg-surface-100 dark:hover:bg-surface-800 transition"
                @click="toggle()" :aria-expanded="open ? 'true' : 'false'">
          <span class="inline-block w-2 h-2 rounded-full"
                :class="status === 'connected' ? 'bg-success-500' : status === 'error' ? 'bg-danger-500' : status === 'connecting' ? 'bg-warning-500' : 'bg-surface-400'"></span>
          <span class="max-w-[180px] truncate" x-text="(me && (me.username || me.principal_id || me.user_key)) || (token ? 'token set' : 'not authenticated')"></span>
          <span class="text-surface-500 dark:text-surface-400 text-[10px]" x-text="open ? '▴' : '▾'"></span>
        </button>
        <div x-show="open" x-cloak @click.outside="close()" x-transition.opacity.duration.150ms
             class="absolute right-0 mt-2 w-80 om-card z-40 space-y-3 shadow-xl">
          <div>
            <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">Broker base URL</p>
            <input type="url" x-model="baseUrl"
                   class="w-full px-2 py-1.5 text-sm rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 text-surface-900 dark:text-surface-100"
                   placeholder="http://127.0.0.1:8081/broker" />
          </div>
          <div>
            <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">Auth mode</p>
            <div class="flex gap-1">
              <button type="button" class="flex-1 px-2 py-1 text-xs rounded-md transition"
                      :class="mode === 'token' ? 'bg-primary-900 text-surface-0 dark:bg-primary-700' : 'border border-surface-300 dark:border-surface-600 text-surface-700 dark:text-surface-200'"
                      @click="mode = 'token'">Static token</button>
              <button type="button" class="flex-1 px-2 py-1 text-xs rounded-md transition"
                      :class="mode === 'login' ? 'bg-primary-900 text-surface-0 dark:bg-primary-700' : 'border border-surface-300 dark:border-surface-600 text-surface-700 dark:text-surface-200'"
                      @click="mode = 'login'">Username + password</button>
            </div>
          </div>
          <div x-show="mode === 'token'" class="space-y-1">
            <label class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Token</label>
            <input type="password" x-model="token"
                   class="w-full px-2 py-1.5 text-sm font-mono rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 text-surface-900 dark:text-surface-100"
                   placeholder="Broker or session token" />
          </div>
          <div x-show="mode === 'login'" class="space-y-2">
            <div>
              <label class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Username</label>
              <input type="text" x-model="username" autocomplete="username"
                     class="w-full px-2 py-1.5 text-sm rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 text-surface-900 dark:text-surface-100"
                     placeholder="admin" />
            </div>
            <div>
              <label class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Password</label>
              <input type="password" x-model="password" autocomplete="current-password"
                     class="w-full px-2 py-1.5 text-sm rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 text-surface-900 dark:text-surface-100"
                     placeholder="••••••••" />
            </div>
          </div>
          <div class="flex gap-2 pt-1">
            <button type="button" class="flex-1 px-3 py-1.5 text-sm rounded-md bg-primary-900 text-surface-0 hover:bg-primary-800 disabled:opacity-50 disabled:cursor-not-allowed transition"
                    :disabled="busy" @click="connect()">
              <span x-show="!busy">Connect</span>
              <span x-show="busy">Connecting…</span>
            </button>
            <button type="button" class="px-3 py-1.5 text-sm rounded-md border border-surface-300 dark:border-surface-600 text-surface-700 dark:text-surface-200 hover:bg-surface-100 dark:hover:bg-surface-800 disabled:opacity-50 transition"
                    :disabled="busy || !token" @click="disconnect()">Disconnect</button>
          </div>
          <div x-show="error" class="text-xs text-danger-700 dark:text-danger-500 bg-danger-500/10 rounded-md px-2 py-1.5" x-text="error"></div>
          <div x-show="me" class="text-xs text-surface-600 dark:text-surface-300 border-t border-surface-200 dark:border-surface-700 pt-2 space-y-0.5">
            <p>Authenticated as <span class="font-mono" x-text="me && (me.username || me.principal_id || me.user_key)"></span></p>
            <p>Role: <span class="font-mono" x-text="me && (me.role || me.auth_mode || '—')"></span></p>
          </div>
        </div>
      </div>

      <button type="button"
              class="p-1.5 rounded-md text-surface-700 dark:text-surface-200 hover:bg-surface-100 dark:hover:bg-surface-800"
              @click="toggleTheme()" :aria-label="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'">
        <span x-show="theme === 'dark'" class="text-base">☀</span>
        <span x-show="theme === 'light'" class="text-base">☾</span>
      </button>
    </header>

    <main class="om-main bg-surface-50 dark:bg-surface-950 overflow-y-auto">

      <!-- ===== DASHBOARD ===== -->
      <template x-if="activeId === 'dashboard'">
        <div class="max-w-6xl mx-auto px-6 py-8 space-y-6" x-data="adminDashboard()" x-init="init()">

          <header class="flex items-start justify-between gap-4 flex-wrap">
            <div>
              <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">Operate</p>
              <h1 class="text-2xl font-semibold tracking-tight">Dashboard</h1>
              <p class="mt-1 text-sm text-surface-600 dark:text-surface-300">
                Live overview of the connected openMiura instance. Visual by default; click <span class="font-mono text-xs">raw</span> on any card to fold out the JSON returned by the underlying endpoint.
              </p>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs text-surface-500 dark:text-surface-400" x-show="lastRefreshAt"
                    x-text="lastRefreshAt ? 'updated ' + lastRefreshAt.toLocaleTimeString() : ''"></span>
              <button class="om-btn om-btn--ghost om-btn--sm" @click="toggleAutoRefresh()">
                <span x-show="autoRefreshSeconds === 0">Auto-refresh: off</span>
                <span x-show="autoRefreshSeconds > 0" x-text="'Auto-refresh: ' + autoRefreshSeconds + 's'"></span>
              </button>
              <button class="om-btn om-btn--primary om-btn--sm" @click="refreshAll()"
                      :disabled="status.state === 'loading'">
                <span x-html="omIcon('arrow-up-down', 'w-3.5 h-3.5')"></span>
                <span>Refresh</span>
              </button>
            </div>
          </header>

          <!-- Not-authenticated empty state -->
          <template x-if="!omAuth.state.token">
            <div class="om-card text-center py-12">
              <div class="mx-auto w-12 h-12 rounded-full bg-warning-500/15 text-warning-700 dark:text-warning-500 flex items-center justify-center mb-3"
                   x-html="omIcon('key', 'w-6 h-6')"></div>
              <h2 class="text-base font-semibold mb-1">Connect to load dashboard data</h2>
              <p class="text-sm text-surface-600 dark:text-surface-300">
                Open the auth dropdown in the topbar, configure the broker base URL and provide a token or login.
              </p>
            </div>
          </template>

          <!-- Authenticated content -->
          <template x-if="omAuth.state.token">
            <div class="space-y-6">

              <!-- Scope summary -->
              <section class="om-card" x-data>
                <div class="flex items-center justify-between mb-3">
                  <h2 class="text-base font-semibold">Active scope</h2>
                  <span class="om-badge om-badge--info">from /auth/me</span>
                </div>
                <template x-if="scopeSummary()">
                  <dl class="grid grid-cols-2 md:grid-cols-5 gap-3 text-sm">
                    <div><dt class="text-xs text-surface-500 dark:text-surface-400">Tenant</dt><dd class="font-mono mt-0.5" x-text="scopeSummary().tenant_id"></dd></div>
                    <div><dt class="text-xs text-surface-500 dark:text-surface-400">Workspace</dt><dd class="font-mono mt-0.5" x-text="scopeSummary().workspace_id"></dd></div>
                    <div><dt class="text-xs text-surface-500 dark:text-surface-400">Environment</dt><dd class="font-mono mt-0.5" x-text="scopeSummary().environment"></dd></div>
                    <div><dt class="text-xs text-surface-500 dark:text-surface-400">Principal</dt><dd class="font-mono mt-0.5" x-text="scopeSummary().principal"></dd></div>
                    <div><dt class="text-xs text-surface-500 dark:text-surface-400">Role</dt><dd class="font-mono mt-0.5" x-text="scopeSummary().role"></dd></div>
                  </dl>
                </template>
                <template x-if="!scopeSummary()">
                  <p class="text-sm text-surface-500 dark:text-surface-400 italic">No identity payload available.</p>
                </template>
              </section>

              <!-- Stat cards row -->
              <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">

                <!-- runtimes -->
                <div class="om-card">
                  <div class="flex items-start justify-between mb-2">
                    <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Openclaw runtimes</p>
                    <span x-html="omIcon('cpu', 'w-4 h-4 text-primary-900 dark:text-accent-300')"></span>
                  </div>
                  <template x-if="runtimes.state === 'loading'"><div class="text-2xl text-surface-400">…</div></template>
                  <template x-if="runtimes.state === 'loaded'">
                    <div class="text-2xl font-semibold tabular-nums" x-text="runtimesCount() ?? '—'"></div>
                  </template>
                  <template x-if="runtimes.state === 'error'">
                    <div class="text-sm text-danger-700 dark:text-danger-500" x-text="runtimes.error"></div>
                  </template>
                  <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline mt-2" @click="showRaw.runtimes = !showRaw.runtimes">
                    <span x-show="!showRaw.runtimes">show raw</span>
                    <span x-show="showRaw.runtimes">hide raw</span>
                  </button>
                  <pre x-show="showRaw.runtimes" x-cloak class="mt-2 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-40 overflow-auto" x-text="runtimes.raw"></pre>
                </div>

                <!-- sessions -->
                <div class="om-card">
                  <div class="flex items-start justify-between mb-2">
                    <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Sessions</p>
                    <span x-html="omIcon('message-circle', 'w-4 h-4 text-primary-900 dark:text-accent-300')"></span>
                  </div>
                  <template x-if="sessions.state === 'loading'"><div class="text-2xl text-surface-400">…</div></template>
                  <template x-if="sessions.state === 'loaded'">
                    <div class="text-2xl font-semibold tabular-nums" x-text="sessionsCount() ?? '—'"></div>
                  </template>
                  <template x-if="sessions.state === 'error'">
                    <div class="text-sm text-danger-700 dark:text-danger-500" x-text="sessions.error"></div>
                  </template>
                  <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline mt-2" @click="showRaw.sessions = !showRaw.sessions">
                    <span x-show="!showRaw.sessions">show raw</span>
                    <span x-show="showRaw.sessions">hide raw</span>
                  </button>
                  <pre x-show="showRaw.sessions" x-cloak class="mt-2 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-40 overflow-auto" x-text="sessions.raw"></pre>
                </div>

                <!-- canvas -->
                <div class="om-card">
                  <div class="flex items-start justify-between mb-2">
                    <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Canvas documents</p>
                    <span x-html="omIcon('layout-dashboard', 'w-4 h-4 text-primary-900 dark:text-accent-300')"></span>
                  </div>
                  <template x-if="canvas.state === 'loading'"><div class="text-2xl text-surface-400">…</div></template>
                  <template x-if="canvas.state === 'loaded'">
                    <div class="text-2xl font-semibold tabular-nums" x-text="canvasCount() ?? '—'"></div>
                  </template>
                  <template x-if="canvas.state === 'error'">
                    <div class="text-sm text-danger-700 dark:text-danger-500" x-text="canvas.error"></div>
                  </template>
                  <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline mt-2" @click="showRaw.canvas = !showRaw.canvas">
                    <span x-show="!showRaw.canvas">show raw</span>
                    <span x-show="showRaw.canvas">hide raw</span>
                  </button>
                  <pre x-show="showRaw.canvas" x-cloak class="mt-2 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-40 overflow-auto" x-text="canvas.raw"></pre>
                </div>

                <!-- system status -->
                <div class="om-card">
                  <div class="flex items-start justify-between mb-2">
                    <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">System</p>
                    <span x-html="omIcon('gauge', 'w-4 h-4 text-primary-900 dark:text-accent-300')"></span>
                  </div>
                  <template x-if="status.state === 'loading'"><div class="text-base text-surface-400">checking…</div></template>
                  <template x-if="status.state === 'loaded'">
                    <span class="om-badge om-badge--success">healthy</span>
                  </template>
                  <template x-if="status.state === 'error'">
                    <div class="text-sm text-danger-700 dark:text-danger-500" x-text="status.error"></div>
                  </template>
                  <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline mt-2" @click="showRaw.status = !showRaw.status">
                    <span x-show="!showRaw.status">show raw</span>
                    <span x-show="showRaw.status">hide raw</span>
                  </button>
                  <pre x-show="showRaw.status" x-cloak class="mt-2 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-40 overflow-auto" x-text="status.raw"></pre>
                </div>
              </section>

              <!-- Recent events -->
              <section class="om-card">
                <div class="flex items-center justify-between mb-3">
                  <h2 class="text-base font-semibold">Recent admin events</h2>
                  <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline" @click="showRaw.events = !showRaw.events">
                    <span x-show="!showRaw.events">show raw</span>
                    <span x-show="showRaw.events">hide raw</span>
                  </button>
                </div>
                <template x-if="events.state === 'loading'">
                  <p class="text-sm text-surface-500 dark:text-surface-400 italic">Loading…</p>
                </template>
                <template x-if="events.state === 'error'">
                  <p class="text-sm text-danger-700 dark:text-danger-500" x-text="events.error"></p>
                </template>
                <template x-if="events.state === 'loaded' && eventsItems().length === 0">
                  <p class="text-sm text-surface-500 dark:text-surface-400 italic">No events.</p>
                </template>
                <template x-if="events.state === 'loaded' && eventsItems().length > 0">
                  <div class="overflow-x-auto">
                    <table class="om-table om-table--compact">
                      <thead><tr><th>When</th><th>Source</th><th>Actor</th><th>Action</th></tr></thead>
                      <tbody>
                        <template x-for="(ev, i) in eventsItems().slice(0, 10)" :key="i">
                          <tr>
                            <td class="font-mono text-xs whitespace-nowrap" x-text="fmtTime(ev.ts || ev.created_at || ev.timestamp)"></td>
                            <td class="font-mono text-xs" x-text="ev.source || ev.channel || '—'"></td>
                            <td class="font-mono text-xs" x-text="ev.actor || ev.user || '—'"></td>
                            <td class="text-sm" x-text="(ev.payload && (ev.payload.action || ev.payload.event)) || ev.event_type || ev.action || '—'"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>
                <pre x-show="showRaw.events" x-cloak class="mt-3 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-60 overflow-auto" x-text="events.raw"></pre>
              </section>

            </div>
          </template>
        </div>
      </template>

      <!-- ===== RUNTIMES ===== -->
      <template x-if="activeId === 'runtimes'">
        <div class="max-w-6xl mx-auto px-6 py-8 space-y-6" x-data="adminRuntimes()" x-init="init()">

          <header class="flex items-start justify-between gap-4 flex-wrap">
            <div>
              <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">Operate</p>
              <h1 class="text-2xl font-semibold tracking-tight">Runtimes</h1>
              <p class="mt-1 text-sm text-surface-600 dark:text-surface-300">
                Registered OpenClaw runtime adapters. Select a row to inspect its concurrency, alerts, notification targets and alert routing. The legacy HTTP path <span class="font-mono text-xs">/admin/openclaw/*</span> is preserved on purpose; see <span class="font-mono text-xs">docs/_archive/refactor/</span> for context.
              </p>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs text-surface-500 dark:text-surface-400" x-show="lastRefreshAt"
                    x-text="lastRefreshAt ? 'updated ' + lastRefreshAt.toLocaleTimeString() : ''"></span>
              <button class="om-btn om-btn--ghost om-btn--sm" @click="refreshList()" :disabled="runtimes.state === 'loading'">
                <span x-html="omIcon('arrow-up-down', 'w-3.5 h-3.5')"></span><span>Refresh</span>
              </button>
            </div>
          </header>

          <!-- empty / not-authed -->
          <template x-if="!omAuth.state.token">
            <div class="om-card text-center py-12">
              <div class="mx-auto w-12 h-12 rounded-full bg-warning-500/15 text-warning-700 dark:text-warning-500 flex items-center justify-center mb-3"
                   x-html="omIcon('key', 'w-6 h-6')"></div>
              <h2 class="text-base font-semibold mb-1">Connect to load runtimes</h2>
              <p class="text-sm text-surface-600 dark:text-surface-300">Use the auth dropdown in the topbar.</p>
            </div>
          </template>

          <template x-if="omAuth.state.token">
            <div class="space-y-6">

              <!-- list -->
              <section class="om-card">
                <div class="flex items-center justify-between mb-3 gap-3 flex-wrap">
                  <div class="flex items-center gap-2">
                    <h2 class="text-base font-semibold">Registered runtimes</h2>
                    <span class="om-badge om-badge--neutral" x-text="itemsList().length"></span>
                  </div>
                  <div class="flex items-center gap-2">
                    <input type="text" x-model="filter" placeholder="Filter…"
                           class="px-2 py-1 text-sm rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800" />
                    <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline" @click="showRaw.runtimes = !showRaw.runtimes">
                      <span x-show="!showRaw.runtimes">show raw</span><span x-show="showRaw.runtimes">hide raw</span>
                    </button>
                  </div>
                </div>

                <template x-if="runtimes.state === 'loading'">
                  <p class="text-sm text-surface-500 dark:text-surface-400 italic">Loading…</p>
                </template>
                <template x-if="runtimes.state === 'error'">
                  <p class="text-sm text-danger-700 dark:text-danger-500" x-text="runtimes.error"></p>
                </template>
                <template x-if="runtimes.state === 'loaded' && filteredItems().length === 0">
                  <p class="text-sm text-surface-500 dark:text-surface-400 italic">
                    <span x-show="!filter">No runtimes registered for this scope.</span>
                    <span x-show="filter">No runtimes match the filter.</span>
                  </p>
                </template>

                <template x-if="runtimes.state === 'loaded' && filteredItems().length > 0">
                  <div class="overflow-x-auto">
                    <table class="om-table om-table--compact">
                      <thead>
                        <tr>
                          <th>Runtime</th>
                          <th>Environment</th>
                          <th>Tenant / Workspace</th>
                          <th>Updated</th>
                          <th></th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="r in filteredItems()" :key="r.runtime_id || r.id || r.name">
                          <tr :class="(r.runtime_id || r.id || r.name) === selectedId ? 'bg-primary-50/60 dark:bg-primary-900/30' : ''">
                            <td class="font-mono text-xs">
                              <button type="button" class="text-left hover:underline"
                                      @click="select(r.runtime_id || r.id || r.name)">
                                <span x-text="r.runtime_id || r.id || r.name || '—'"></span>
                              </button>
                            </td>
                            <td class="font-mono text-xs" x-text="r.environment || '—'"></td>
                            <td class="font-mono text-xs">
                              <span x-text="r.tenant_id || '—'"></span> / <span x-text="r.workspace_id || '—'"></span>
                            </td>
                            <td class="text-xs whitespace-nowrap" x-text="r.updated_at ? new Date((typeof r.updated_at === 'number' ? r.updated_at * (r.updated_at > 1e12 ? 1 : 1000) : Date.parse(r.updated_at))).toLocaleString() : '—'"></td>
                            <td>
                              <button class="om-btn om-btn--ghost om-btn--sm" @click="select(r.runtime_id || r.id || r.name)">Inspect</button>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>

                <pre x-show="showRaw.runtimes" x-cloak class="mt-3 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-60 overflow-auto" x-text="runtimes.raw"></pre>
              </section>

              <!-- detail -->
              <template x-if="selectedId">
                <section class="om-card">
                  <div class="flex items-center justify-between mb-3 gap-3 flex-wrap">
                    <div>
                      <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Selected runtime</p>
                      <h2 class="text-base font-semibold font-mono mt-0.5" x-text="selectedId"></h2>
                    </div>
                    <div class="flex items-center gap-2">
                      <button class="om-btn om-btn--ghost om-btn--sm" @click="refreshDetail()">
                        <span x-html="omIcon('arrow-up-down', 'w-3.5 h-3.5')"></span><span>Refresh detail</span>
                      </button>
                      <button class="om-btn om-btn--danger om-btn--sm" @click="openRecoveryDialog()">
                        <span x-html="omIcon('terminal', 'w-3.5 h-3.5')"></span><span>Trigger recovery</span>
                      </button>
                    </div>
                  </div>

                  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
                    <div class="om-card">
                      <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">Concurrency</p>
                      <template x-if="concurrency.state === 'loaded' && concurrencySummary()">
                        <p class="text-lg tabular-nums">
                          <span class="font-semibold" x-text="concurrencySummary().current ?? '—'"></span>
                          <span class="text-surface-500 dark:text-surface-400"> / </span>
                          <span x-text="concurrencySummary().max ?? '—'"></span>
                        </p>
                      </template>
                      <template x-if="concurrency.state !== 'loaded'"><p class="text-sm text-surface-400 italic">—</p></template>
                      <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline mt-2" @click="showRaw.concurrency = !showRaw.concurrency">
                        <span x-show="!showRaw.concurrency">show raw</span><span x-show="showRaw.concurrency">hide raw</span>
                      </button>
                      <pre x-show="showRaw.concurrency" x-cloak class="mt-2 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-32 overflow-auto" x-text="concurrency.raw"></pre>
                    </div>
                    <div class="om-card">
                      <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">Alerts</p>
                      <p class="text-lg font-semibold tabular-nums" x-text="alertCount()"></p>
                      <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline mt-2" @click="showRaw.alerts = !showRaw.alerts">
                        <span x-show="!showRaw.alerts">show raw</span><span x-show="showRaw.alerts">hide raw</span>
                      </button>
                      <pre x-show="showRaw.alerts" x-cloak class="mt-2 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-32 overflow-auto" x-text="alerts.raw"></pre>
                    </div>
                    <div class="om-card">
                      <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">Notification targets</p>
                      <p class="text-lg font-semibold tabular-nums" x-text="notificationTargetCount()"></p>
                      <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline mt-2" @click="showRaw.notificationTargets = !showRaw.notificationTargets">
                        <span x-show="!showRaw.notificationTargets">show raw</span><span x-show="showRaw.notificationTargets">hide raw</span>
                      </button>
                      <pre x-show="showRaw.notificationTargets" x-cloak class="mt-2 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-32 overflow-auto" x-text="notificationTargets.raw"></pre>
                    </div>
                    <div class="om-card">
                      <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">Alert routing</p>
                      <p class="text-lg font-semibold tabular-nums" x-text="(alertRoutingPolicyVersions() ?? '—') + (alertRoutingPolicyVersions() != null ? ' versions' : '')"></p>
                      <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline mt-2" @click="showRaw.alertRouting = !showRaw.alertRouting">
                        <span x-show="!showRaw.alertRouting">show raw</span><span x-show="showRaw.alertRouting">hide raw</span>
                      </button>
                      <pre x-show="showRaw.alertRouting" x-cloak class="mt-2 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-32 overflow-auto" x-text="alertRouting.raw"></pre>
                    </div>
                  </div>

                  <details class="text-sm">
                    <summary class="cursor-pointer text-surface-700 dark:text-surface-200 select-none">Selected runtime payload</summary>
                    <pre class="mt-2 text-[11px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-72 overflow-auto" x-text="JSON.stringify(selectedRuntime(), null, 2)"></pre>
                  </details>
                </section>
              </template>

              <!-- recovery modal -->
              <div x-data="omModalFor('runtimes-recovery')" x-show="open" x-cloak class="om-modal-overlay" @click.self="close()">
                <div class="om-modal" role="dialog" aria-modal="true" aria-labelledby="recovery-title">
                  <div class="om-modal__header">
                    <h3 id="recovery-title" class="text-base font-semibold">Trigger recovery job</h3>
                    <button class="om-btn om-btn--ghost om-btn--sm" @click="close()" aria-label="Close">
                      <span x-html="omIcon('x', 'w-4 h-4')"></span>
                    </button>
                  </div>
                  <div class="om-modal__body space-y-3 text-sm">
                    <p class="text-surface-600 dark:text-surface-300">
                      Create a recovery job against <span class="font-mono" x-text="selectedId"></span>. The reason is recorded on the audit trail and becomes part of any later evidence pack.
                    </p>
                    <div>
                      <label class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Reason</label>
                      <textarea x-model="recoveryForm.reason" rows="3" placeholder="e.g. dispatch queue backed up, draining via recovery"
                                class="mt-1 w-full px-2 py-1.5 text-sm rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800"></textarea>
                    </div>
                    <div x-show="recoveryForm.error" class="text-xs text-danger-700 dark:text-danger-500 bg-danger-500/10 rounded-md px-2 py-1.5" x-text="recoveryForm.error"></div>
                  </div>
                  <div class="om-modal__footer">
                    <button class="om-btn om-btn--ghost" @click="close()" :disabled="recoveryForm.busy">Cancel</button>
                    <button class="om-btn om-btn--danger" @click="submitRecovery()" :disabled="recoveryForm.busy">
                      <span x-show="!recoveryForm.busy">Trigger</span>
                      <span x-show="recoveryForm.busy">Triggering…</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- ===== POLICIES ===== -->
      <template x-if="activeId === 'policies'">
        <div class="max-w-6xl mx-auto px-6 py-8 space-y-6" x-data="adminPolicies()" x-init="init()">

          <header class="flex items-start justify-between gap-4 flex-wrap">
            <div>
              <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">Govern</p>
              <h1 class="text-2xl font-semibold tracking-tight">Policies</h1>
              <p class="mt-1 text-sm text-surface-600 dark:text-surface-300">
                Registered policy packs and the current policy snapshot, plus the three explorer endpoints: <span class="font-mono text-xs">explain</span> a decision, <span class="font-mono text-xs">simulate</span> a candidate YAML, and <span class="font-mono text-xs">diff</span> a candidate against a baseline. All three are read-modeled — they do not mutate the active policy.
              </p>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs text-surface-500 dark:text-surface-400" x-show="lastRefreshAt"
                    x-text="lastRefreshAt ? 'updated ' + lastRefreshAt.toLocaleTimeString() : ''"></span>
              <button class="om-btn om-btn--ghost om-btn--sm" @click="refreshAll()" :disabled="packs.state === 'loading' || snapshot.state === 'loading'">
                <span x-html="omIcon('arrow-up-down', 'w-3.5 h-3.5')"></span><span>Refresh</span>
              </button>
            </div>
          </header>

          <!-- empty / not-authed -->
          <template x-if="!omAuth.state.token">
            <div class="om-card text-center py-12">
              <div class="mx-auto w-12 h-12 rounded-full bg-warning-500/15 text-warning-700 dark:text-warning-500 flex items-center justify-center mb-3"
                   x-html="omIcon('key', 'w-6 h-6')"></div>
              <h2 class="text-base font-semibold mb-1">Connect to load policies</h2>
              <p class="text-sm text-surface-600 dark:text-surface-300">Use the auth dropdown in the topbar.</p>
            </div>
          </template>

          <template x-if="omAuth.state.token">
            <div class="space-y-6">

              <!-- packs + snapshot row -->
              <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">

                <!-- pack registry -->
                <section class="om-card">
                  <div class="flex items-center justify-between mb-3 gap-2 flex-wrap">
                    <div class="flex items-center gap-2">
                      <h2 class="text-base font-semibold">Registered policy packs</h2>
                      <span class="om-badge om-badge--neutral" x-text="packCount()"></span>
                    </div>
                    <div class="flex items-center gap-2">
                      <input type="text" x-model="runtimeClass" placeholder="runtime class"
                             class="px-2 py-1 text-sm rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 w-28" />
                      <button class="om-btn om-btn--ghost om-btn--sm" @click="refreshPacks()" :disabled="packs.state === 'loading'">Apply</button>
                      <input type="text" x-model="filter" placeholder="Filter…"
                             class="px-2 py-1 text-sm rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 w-32" />
                    </div>
                  </div>
                  <template x-if="packs.state === 'loading'">
                    <p class="text-sm text-surface-500 dark:text-surface-400 italic">Loading…</p>
                  </template>
                  <template x-if="packs.state === 'error'">
                    <p class="text-sm text-danger-700 dark:text-danger-500" x-text="packs.error"></p>
                  </template>
                  <template x-if="packs.state === 'loaded' && filteredPacks().length === 0">
                    <p class="text-sm text-surface-500 dark:text-surface-400 italic">No policy packs match.</p>
                  </template>
                  <template x-if="packs.state === 'loaded' && filteredPacks().length > 0">
                    <ul class="text-sm space-y-2 max-h-72 overflow-auto pr-1">
                      <template x-for="p in filteredPacks()" :key="p.pack_name || p.name || p.id || JSON.stringify(p)">
                        <li class="flex items-start justify-between gap-2 py-1 border-b border-surface-100 dark:border-surface-800 last:border-b-0">
                          <div class="min-w-0 flex-1">
                            <div class="font-mono text-xs truncate" x-text="p.pack_name || p.name || p.id || '—'"></div>
                            <div class="text-[10px] text-surface-500 dark:text-surface-400 truncate"
                                 x-text="p.runtime_class || p.transport || p.description || ''"></div>
                          </div>
                          <div class="flex items-center gap-2 shrink-0">
                            <span class="om-badge om-badge--neutral text-[10px]" x-text="p.version || p.revision || ''"></span>
                            <button class="om-btn om-btn--ghost om-btn--sm"
                                    @click="openApplyDialog(p.pack_name || p.name || p.id)">
                              Apply to runtime…
                            </button>
                          </div>
                        </li>
                      </template>
                    </ul>
                  </template>
                  <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline mt-3"
                          @click="showRaw.packs = !showRaw.packs">
                    <span x-show="!showRaw.packs">show raw</span><span x-show="showRaw.packs">hide raw</span>
                  </button>
                  <pre x-show="showRaw.packs" x-cloak class="mt-2 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-60 overflow-auto" x-text="packs.raw"></pre>
                </section>

                <!-- snapshot -->
                <section class="om-card">
                  <div class="flex items-center justify-between mb-3 gap-2">
                    <h2 class="text-base font-semibold">Policy snapshot</h2>
                    <button class="om-btn om-btn--ghost om-btn--sm" @click="refreshSnapshot()" :disabled="snapshot.state === 'loading'">Reload</button>
                  </div>
                  <template x-if="snapshot.state === 'loading'">
                    <p class="text-sm text-surface-500 dark:text-surface-400 italic">Loading…</p>
                  </template>
                  <template x-if="snapshot.state === 'error'">
                    <p class="text-sm text-danger-700 dark:text-danger-500" x-text="snapshot.error"></p>
                  </template>
                  <template x-if="snapshot.state === 'loaded'">
                    <div class="text-sm text-surface-700 dark:text-surface-300 space-y-1">
                      <p>
                        <span class="text-surface-500 dark:text-surface-400">Status: </span>
                        <span class="font-mono" x-text="snapshot.data && snapshot.data.ok ? 'ok' : (snapshot.data && snapshot.data.status || '—')"></span>
                      </p>
                      <p class="text-xs text-surface-500 dark:text-surface-400">
                        Inspect the verbatim JSON for the active policy:
                      </p>
                    </div>
                  </template>
                  <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline mt-2"
                          @click="showRaw.snapshot = !showRaw.snapshot">
                    <span x-show="!showRaw.snapshot">show raw</span><span x-show="showRaw.snapshot">hide raw</span>
                  </button>
                  <pre x-show="showRaw.snapshot" x-cloak class="mt-2 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-60 overflow-auto" x-text="snapshot.raw"></pre>
                </section>
              </div>

              <!-- explain -->
              <section class="om-card">
                <div class="flex items-center justify-between mb-3 gap-2">
                  <h2 class="text-base font-semibold">Explain a decision</h2>
                  <span class="text-[10px] font-mono text-surface-500 dark:text-surface-400">POST /admin/policies/explain</span>
                </div>
                <p class="text-sm text-surface-600 dark:text-surface-300 mb-3">
                  Ask the policy engine why a request was — or would be — allowed or denied. Fields with default values can be left blank.
                </p>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-sm">
                  <label class="block">
                    <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Scope</span>
                    <select x-model="explainForm.scope" class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800">
                      <option value="tool">tool</option>
                      <option value="memory">memory</option>
                      <option value="secret">secret</option>
                      <option value="channel">channel</option>
                      <option value="approval">approval</option>
                    </select>
                  </label>
                  <label class="block md:col-span-2">
                    <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Resource name *</span>
                    <input type="text" x-model="explainForm.resource_name" placeholder="e.g. http_get, secret://stripe"
                           class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs" />
                  </label>
                  <label class="block">
                    <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Action</span>
                    <input type="text" x-model="explainForm.action" placeholder="use"
                           class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs" />
                  </label>
                  <label class="block">
                    <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Agent name</span>
                    <input type="text" x-model="explainForm.agent_name" placeholder="(optional)"
                           class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs" />
                  </label>
                  <label class="block">
                    <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">User role</span>
                    <input type="text" x-model="explainForm.user_role" placeholder="(optional)"
                           class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs" />
                  </label>
                </div>
                <div class="mt-3 flex items-center gap-2">
                  <button class="om-btn om-btn--primary om-btn--sm" @click="submitExplain()" :disabled="explainResult.state === 'loading'">
                    <span x-show="explainResult.state !== 'loading'">Explain</span>
                    <span x-show="explainResult.state === 'loading'">Resolving…</span>
                  </button>
                  <button class="om-btn om-btn--ghost om-btn--sm" @click="showRaw.explainResult = !showRaw.explainResult">
                    <span x-show="!showRaw.explainResult">show raw</span><span x-show="showRaw.explainResult">hide raw</span>
                  </button>
                </div>
                <template x-if="explainResult.state === 'error'">
                  <p class="mt-3 text-sm text-danger-700 dark:text-danger-500" x-text="explainResult.error"></p>
                </template>
                <template x-if="explainResult.state === 'loaded'">
                  <div class="mt-3 flex items-center gap-2 text-sm">
                    <span class="text-surface-500 dark:text-surface-400">Decision:</span>
                    <span class="om-badge" :class="'om-badge--' + decisionTone(decisionLabel(explainResult.data))" x-text="decisionLabel(explainResult.data)"></span>
                    <span class="text-surface-500 dark:text-surface-400" x-text="explainResult.data && explainResult.data.reason ? '— ' + explainResult.data.reason : ''"></span>
                  </div>
                </template>
                <pre x-show="showRaw.explainResult" x-cloak class="mt-3 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-60 overflow-auto" x-text="explainResult.raw"></pre>
              </section>

              <!-- simulate -->
              <section class="om-card">
                <div class="flex items-center justify-between mb-3 gap-2">
                  <h2 class="text-base font-semibold">Simulate a candidate policy</h2>
                  <span class="text-[10px] font-mono text-surface-500 dark:text-surface-400">POST /admin/policy-explorer/simulate</span>
                </div>
                <p class="text-sm text-surface-600 dark:text-surface-300 mb-3">
                  Replace the active policy with the YAML below and resolve the same request. The active policy is not modified.
                </p>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 text-sm">
                  <div class="space-y-2">
                    <label class="block">
                      <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Scope</span>
                      <select x-model="simulateForm.scope" class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800">
                        <option value="tool">tool</option>
                        <option value="memory">memory</option>
                        <option value="secret">secret</option>
                        <option value="channel">channel</option>
                        <option value="approval">approval</option>
                      </select>
                    </label>
                    <label class="block">
                      <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Resource name *</span>
                      <input type="text" x-model="simulateForm.resource_name"
                             class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs" />
                    </label>
                    <label class="block">
                      <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Action</span>
                      <input type="text" x-model="simulateForm.action"
                             class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs" />
                    </label>
                  </div>
                  <label class="block">
                    <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Candidate policy (YAML)</span>
                    <textarea x-model="simulateForm.candidate_policy_yaml" rows="8" spellcheck="false"
                              placeholder="version: 1&#10;rules:&#10;  - scope: tool&#10;    resource: http_get&#10;    decision: allow"
                              class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs"></textarea>
                  </label>
                </div>
                <div class="mt-3 flex items-center gap-2">
                  <button class="om-btn om-btn--primary om-btn--sm" @click="submitSimulate()" :disabled="simulateResult.state === 'loading'">
                    <span x-show="simulateResult.state !== 'loading'">Simulate</span>
                    <span x-show="simulateResult.state === 'loading'">Simulating…</span>
                  </button>
                  <button class="om-btn om-btn--ghost om-btn--sm" @click="showRaw.simulateResult = !showRaw.simulateResult">
                    <span x-show="!showRaw.simulateResult">show raw</span><span x-show="showRaw.simulateResult">hide raw</span>
                  </button>
                </div>
                <template x-if="simulateResult.state === 'error'">
                  <p class="mt-3 text-sm text-danger-700 dark:text-danger-500" x-text="simulateResult.error"></p>
                </template>
                <template x-if="simulateResult.state === 'loaded'">
                  <div class="mt-3 flex items-center gap-2 text-sm">
                    <span class="text-surface-500 dark:text-surface-400">Simulated:</span>
                    <span class="om-badge" :class="'om-badge--' + decisionTone(decisionLabel(simulateResult.data))" x-text="decisionLabel(simulateResult.data)"></span>
                    <span class="text-surface-500 dark:text-surface-400" x-show="simulateResult.data && simulateResult.data.changed === true">— differs from active policy</span>
                  </div>
                </template>
                <pre x-show="showRaw.simulateResult" x-cloak class="mt-3 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-60 overflow-auto" x-text="simulateResult.raw"></pre>
              </section>

              <!-- diff -->
              <section class="om-card">
                <div class="flex items-center justify-between mb-3 gap-2">
                  <h2 class="text-base font-semibold">Diff candidate vs baseline</h2>
                  <span class="text-[10px] font-mono text-surface-500 dark:text-surface-400">POST /admin/policy-explorer/diff</span>
                </div>
                <p class="text-sm text-surface-600 dark:text-surface-300 mb-3">
                  Both YAMLs are optional — empty means "use the active policy". <strong>Samples</strong> is a JSON array of decision requests that get evaluated under both policies; the response lists which samples change verdict.
                </p>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 text-sm">
                  <label class="block">
                    <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Baseline (YAML)</span>
                    <textarea x-model="diffForm.baseline_policy_yaml" rows="6" spellcheck="false"
                              placeholder="(blank = active policy)"
                              class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs"></textarea>
                  </label>
                  <label class="block">
                    <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Candidate (YAML)</span>
                    <textarea x-model="diffForm.candidate_policy_yaml" rows="6" spellcheck="false"
                              placeholder="(blank = active policy)"
                              class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs"></textarea>
                  </label>
                  <label class="block lg:col-span-2">
                    <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Samples (JSON array)</span>
                    <textarea x-model="diffForm.samples_json" rows="4" spellcheck="false"
                              placeholder='[{"scope":"tool","resource_name":"http_get","action":"use"}]'
                              class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs"></textarea>
                    <div x-show="diffForm.samples_error" class="mt-1 text-xs text-danger-700 dark:text-danger-500" x-text="diffForm.samples_error"></div>
                  </label>
                </div>
                <div class="mt-3 flex items-center gap-2">
                  <button class="om-btn om-btn--primary om-btn--sm" @click="submitDiff()" :disabled="diffResult.state === 'loading'">
                    <span x-show="diffResult.state !== 'loading'">Compute diff</span>
                    <span x-show="diffResult.state === 'loading'">Diffing…</span>
                  </button>
                  <button class="om-btn om-btn--ghost om-btn--sm" @click="showRaw.diffResult = !showRaw.diffResult">
                    <span x-show="!showRaw.diffResult">show raw</span><span x-show="showRaw.diffResult">hide raw</span>
                  </button>
                </div>
                <template x-if="diffResult.state === 'error'">
                  <p class="mt-3 text-sm text-danger-700 dark:text-danger-500" x-text="diffResult.error"></p>
                </template>
                <template x-if="diffResult.state === 'loaded'">
                  <div class="mt-3 text-sm flex items-center gap-2">
                    <span class="text-surface-500 dark:text-surface-400">Samples differing:</span>
                    <span class="om-badge" :class="'om-badge--' + (diffChangedCount() ? 'warning' : 'success')" x-text="diffChangedCount() ?? '—'"></span>
                  </div>
                </template>
                <pre x-show="showRaw.diffResult" x-cloak class="mt-3 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-72 overflow-auto" x-text="diffResult.raw"></pre>
              </section>

              <!-- last apply-pack result -->
              <template x-if="applyResult.state === 'loaded' || applyResult.state === 'error'">
                <section class="om-card">
                  <div class="flex items-center justify-between mb-2 gap-2">
                    <h2 class="text-base font-semibold">Last pack application</h2>
                    <span class="text-[10px] font-mono text-surface-500 dark:text-surface-400">POST /admin/openclaw/runtimes/&lt;id&gt;/policy-pack</span>
                  </div>
                  <template x-if="applyResult.state === 'error'">
                    <p class="text-sm text-danger-700 dark:text-danger-500" x-text="applyResult.error"></p>
                  </template>
                  <template x-if="applyResult.state === 'loaded'">
                    <p class="text-sm flex items-center gap-2">
                      <span class="om-badge om-badge--success">applied</span>
                      <span class="text-surface-500 dark:text-surface-400 text-xs"
                            x-text="applyResult.data && applyResult.data.runtime_summary ? ('runtime_id: ' + (applyResult.data.runtime_summary.runtime_id || '—')) : ''"></span>
                    </p>
                  </template>
                  <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline mt-2"
                          @click="showRaw.applyResult = !showRaw.applyResult">
                    <span x-show="!showRaw.applyResult">show raw</span><span x-show="showRaw.applyResult">hide raw</span>
                  </button>
                  <pre x-show="showRaw.applyResult" x-cloak class="mt-2 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-60 overflow-auto" x-text="applyResult.raw"></pre>
                </section>
              </template>

              <!-- apply pack modal -->
              <div x-data="omModalFor('policies-apply-pack')" x-show="open" x-cloak class="om-modal-overlay" @click.self="close()">
                <div class="om-modal" role="dialog" aria-modal="true" aria-labelledby="policies-apply-pack-title">
                  <div class="om-modal__header">
                    <h3 id="policies-apply-pack-title" class="text-base font-semibold">Apply policy pack to runtime</h3>
                    <button class="om-btn om-btn--ghost om-btn--sm" @click="close()" aria-label="Close">
                      <span x-html="omIcon('x', 'w-4 h-4')"></span>
                    </button>
                  </div>
                  <div class="om-modal__body space-y-3 text-sm">
                    <p class="text-surface-600 dark:text-surface-300">
                      Apply pack <span class="font-mono text-xs" x-text="applyForm.pack_name"></span> to a runtime. The runtime's active policy is replaced; the action is recorded on the audit trail with the actor name below.
                    </p>
                    <label class="block">
                      <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Runtime id *</span>
                      <input type="text" x-model="applyForm.runtime_id" placeholder="e.g. openclaw-prod-1"
                             class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs" />
                    </label>
                    <label class="block">
                      <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Pack name *</span>
                      <input type="text" x-model="applyForm.pack_name"
                             class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs" />
                    </label>
                    <label class="block">
                      <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Runtime class</span>
                      <input type="text" x-model="applyForm.runtime_class" placeholder="(optional, backend will infer)"
                             class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs" />
                    </label>
                    <label class="block">
                      <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Actor</span>
                      <input type="text" x-model="applyForm.actor"
                             class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs" />
                    </label>
                    <div x-show="applyForm.error" class="text-xs text-danger-700 dark:text-danger-500 bg-danger-500/10 rounded-md px-2 py-1.5" x-text="applyForm.error"></div>
                  </div>
                  <div class="om-modal__footer">
                    <button class="om-btn om-btn--ghost" @click="close()" :disabled="applyForm.busy">Cancel</button>
                    <button class="om-btn om-btn--primary" @click="submitApplyPack()" :disabled="applyForm.busy">
                      <span x-show="!applyForm.busy">Apply</span>
                      <span x-show="applyForm.busy">Applying…</span>
                    </button>
                  </div>
                </div>
              </div>

            </div>
          </template>
        </div>
      </template>

      <!-- ===== SECRETS ===== -->
      <template x-if="activeId === 'secrets'">
        <div class="max-w-6xl mx-auto px-6 py-8 space-y-6" x-data="adminSecrets()" x-init="init()">

          <header class="flex items-start justify-between gap-4 flex-wrap">
            <div>
              <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">Govern</p>
              <h1 class="text-2xl font-semibold tracking-tight">Secrets</h1>
              <p class="mt-1 text-sm text-surface-600 dark:text-surface-300">
                Secret-governance surface for compliance and forensics. The catalog lists declared <span class="font-mono text-xs">ref</span>s in the active scope; the values themselves never leave the backend. The explain form is read-modeled — it replays a decision without consuming the secret.
              </p>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs text-surface-500 dark:text-surface-400" x-show="lastRefreshAt"
                    x-text="lastRefreshAt ? 'updated ' + lastRefreshAt.toLocaleTimeString() : ''"></span>
              <button class="om-btn om-btn--ghost om-btn--sm" @click="refreshAll()" :disabled="summary.state === 'loading'">
                <span x-html="omIcon('arrow-up-down', 'w-3.5 h-3.5')"></span><span>Refresh all</span>
              </button>
            </div>
          </header>

          <template x-if="!omAuth.state.token">
            <div class="om-card text-center py-12">
              <div class="mx-auto w-12 h-12 rounded-full bg-warning-500/15 text-warning-700 dark:text-warning-500 flex items-center justify-center mb-3"
                   x-html="omIcon('key', 'w-6 h-6')"></div>
              <h2 class="text-base font-semibold mb-1">Connect to load secret governance</h2>
              <p class="text-sm text-surface-600 dark:text-surface-300">Use the auth dropdown in the topbar.</p>
            </div>
          </template>

          <template x-if="omAuth.state.token">
            <div class="space-y-6">

              <!-- shared filters -->
              <section class="om-card">
                <div class="flex items-center justify-between mb-3 gap-2">
                  <h2 class="text-base font-semibold">Filters</h2>
                  <span class="text-[10px] font-mono text-surface-500 dark:text-surface-400">applied to catalog / timeline / usage</span>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-5 gap-3 text-sm">
                  <label class="block">
                    <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Free text (q)</span>
                    <input type="text" x-model="filters.q" placeholder="(optional)"
                           class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs" />
                  </label>
                  <label class="block">
                    <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Ref</span>
                    <input type="text" x-model="filters.ref" placeholder="e.g. secret://stripe"
                           class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs" />
                  </label>
                  <label class="block">
                    <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Tool</span>
                    <input type="text" x-model="filters.tool" placeholder="(optional)"
                           class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs" />
                  </label>
                  <label class="block">
                    <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Outcome</span>
                    <select x-model="filters.outcome" class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 text-xs">
                      <option value="">any</option>
                      <option value="allow">allow</option>
                      <option value="deny">deny</option>
                    </select>
                  </label>
                  <label class="block">
                    <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Limit</span>
                    <input type="number" min="1" max="500" x-model.number="filters.limit"
                           class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs" />
                  </label>
                </div>
              </section>

              <!-- summary -->
              <section class="om-card">
                <div class="flex items-center justify-between mb-3 gap-2">
                  <h2 class="text-base font-semibold">Summary</h2>
                  <span class="text-[10px] font-mono text-surface-500 dark:text-surface-400">GET /admin/secrets/summary</span>
                </div>
                <template x-if="summary.state === 'loading'">
                  <p class="text-sm text-surface-500 dark:text-surface-400 italic">Loading…</p>
                </template>
                <template x-if="summary.state === 'error'">
                  <p class="text-sm text-danger-700 dark:text-danger-500" x-text="summary.error"></p>
                </template>
                <template x-if="summary.state === 'loaded'">
                  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
                    <div>
                      <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Total events</p>
                      <p class="text-2xl font-semibold tabular-nums" x-text="summaryStats().total ?? '—'"></p>
                    </div>
                    <div>
                      <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Allowed</p>
                      <p class="text-2xl font-semibold tabular-nums text-success-700 dark:text-success-500" x-text="summaryStats().allowed ?? '—'"></p>
                    </div>
                    <div>
                      <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Denied</p>
                      <p class="text-2xl font-semibold tabular-nums text-danger-700 dark:text-danger-500" x-text="summaryStats().denied ?? '—'"></p>
                    </div>
                    <div>
                      <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Deny rate</p>
                      <p class="text-2xl font-semibold tabular-nums flex items-center gap-2">
                        <span x-text="summaryStats().deny_rate_pct == null ? '—' : summaryStats().deny_rate_pct + '%'"></span>
                        <span class="om-badge text-[10px]" :class="'om-badge--' + summaryTone()"
                              x-text="summaryTone()"></span>
                      </p>
                    </div>
                  </div>
                </template>
                <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline mt-3"
                        @click="showRaw.summary = !showRaw.summary">
                  <span x-show="!showRaw.summary">show raw</span><span x-show="showRaw.summary">hide raw</span>
                </button>
                <pre x-show="showRaw.summary" x-cloak class="mt-2 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-60 overflow-auto" x-text="summary.raw"></pre>
              </section>

              <!-- catalog -->
              <section class="om-card">
                <div class="flex items-center justify-between mb-3 gap-2">
                  <h2 class="text-base font-semibold">Catalog
                    <span class="om-badge om-badge--neutral ml-2" x-text="catalogItems().length"></span>
                  </h2>
                  <div class="flex items-center gap-2">
                    <span class="text-[10px] font-mono text-surface-500 dark:text-surface-400">GET /admin/secrets/catalog</span>
                    <button class="om-btn om-btn--ghost om-btn--sm" @click="refreshCatalog()" :disabled="catalog.state === 'loading'">Reload</button>
                  </div>
                </div>
                <template x-if="catalog.state === 'loading'">
                  <p class="text-sm text-surface-500 dark:text-surface-400 italic">Loading…</p>
                </template>
                <template x-if="catalog.state === 'error'">
                  <p class="text-sm text-danger-700 dark:text-danger-500" x-text="catalog.error"></p>
                </template>
                <template x-if="catalog.state === 'loaded' && catalogItems().length === 0">
                  <p class="text-sm text-surface-500 dark:text-surface-400 italic">No declared secret refs in this scope.</p>
                </template>
                <template x-if="catalog.state === 'loaded' && catalogItems().length > 0">
                  <div class="overflow-x-auto">
                    <table class="om-table om-table--compact">
                      <thead>
                        <tr>
                          <th>Ref</th>
                          <th>Source</th>
                          <th>Last seen</th>
                          <th>Tools</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="item in catalogItems()" :key="item.ref || JSON.stringify(item)">
                          <tr>
                            <td class="font-mono text-xs" x-text="item.ref || '—'"></td>
                            <td class="text-xs" x-text="item.source || item.provider || '—'"></td>
                            <td class="text-xs whitespace-nowrap" x-text="item.last_seen_at || item.updated_at || '—'"></td>
                            <td class="text-xs" x-text="(item.tools && item.tools.join ? item.tools.join(', ') : '—')"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>
                <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline mt-3"
                        @click="showRaw.catalog = !showRaw.catalog">
                  <span x-show="!showRaw.catalog">show raw</span><span x-show="showRaw.catalog">hide raw</span>
                </button>
                <pre x-show="showRaw.catalog" x-cloak class="mt-2 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-60 overflow-auto" x-text="catalog.raw"></pre>
              </section>

              <!-- timeline + usage row -->
              <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">

                <section class="om-card">
                  <div class="flex items-center justify-between mb-3 gap-2">
                    <h2 class="text-base font-semibold">Timeline
                      <span class="om-badge om-badge--neutral ml-2" x-text="timelineItems().length"></span>
                    </h2>
                    <button class="om-btn om-btn--ghost om-btn--sm" @click="refreshTimeline()" :disabled="timeline.state === 'loading'">Reload</button>
                  </div>
                  <template x-if="timeline.state === 'loading'">
                    <p class="text-sm text-surface-500 dark:text-surface-400 italic">Loading…</p>
                  </template>
                  <template x-if="timeline.state === 'error'">
                    <p class="text-sm text-danger-700 dark:text-danger-500" x-text="timeline.error"></p>
                  </template>
                  <template x-if="timeline.state === 'loaded' && timelineItems().length === 0">
                    <p class="text-sm text-surface-500 dark:text-surface-400 italic">No timeline events match.</p>
                  </template>
                  <template x-if="timeline.state === 'loaded' && timelineItems().length > 0">
                    <ul class="text-xs space-y-2 max-h-72 overflow-auto pr-1">
                      <template x-for="(ev, i) in timelineItems()" :key="i">
                        <li class="flex items-start gap-2 border-b border-surface-100 dark:border-surface-800 last:border-b-0 pb-1">
                          <span class="om-badge text-[10px]" :class="'om-badge--' + decisionTone(decisionLabel(ev))"
                                x-text="decisionLabel(ev)"></span>
                          <div class="min-w-0 flex-1">
                            <div class="font-mono truncate" x-text="(ev.ref || '—') + ' / ' + (ev.tool_name || '—')"></div>
                            <div class="text-[10px] text-surface-500 dark:text-surface-400 truncate"
                                 x-text="ev.reason || ev.policy_reason || ev.user_role || ''"></div>
                          </div>
                          <span class="text-[10px] text-surface-500 dark:text-surface-400 whitespace-nowrap"
                                x-text="ev.ts || ev.timestamp || ''"></span>
                        </li>
                      </template>
                    </ul>
                  </template>
                  <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline mt-3"
                          @click="showRaw.timeline = !showRaw.timeline">
                    <span x-show="!showRaw.timeline">show raw</span><span x-show="showRaw.timeline">hide raw</span>
                  </button>
