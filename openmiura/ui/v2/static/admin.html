                  <pre x-show="showRaw.timeline" x-cloak class="mt-2 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-60 overflow-auto" x-text="timeline.raw"></pre>
                </section>

                <section class="om-card">
                  <div class="flex items-center justify-between mb-3 gap-2">
                    <h2 class="text-base font-semibold">Usage
                      <span class="om-badge om-badge--neutral ml-2" x-text="usageItems().length"></span>
                    </h2>
                    <button class="om-btn om-btn--ghost om-btn--sm" @click="refreshUsage()" :disabled="usage.state === 'loading'">Reload</button>
                  </div>
                  <template x-if="usage.state === 'loading'">
                    <p class="text-sm text-surface-500 dark:text-surface-400 italic">Loading…</p>
                  </template>
                  <template x-if="usage.state === 'error'">
                    <p class="text-sm text-danger-700 dark:text-danger-500" x-text="usage.error"></p>
                  </template>
                  <template x-if="usage.state === 'loaded' && usageItems().length === 0">
                    <p class="text-sm text-surface-500 dark:text-surface-400 italic">No usage groups match.</p>
                  </template>
                  <template x-if="usage.state === 'loaded' && usageItems().length > 0">
                    <ul class="text-xs space-y-2 max-h-72 overflow-auto pr-1">
                      <template x-for="(g, i) in usageItems()" :key="i">
                        <li class="flex items-center justify-between gap-2 border-b border-surface-100 dark:border-surface-800 last:border-b-0 pb-1">
                          <div class="min-w-0 flex-1">
                            <div class="font-mono truncate" x-text="(g.ref || '—') + ' / ' + (g.tool_name || g.tool || '—')"></div>
                          </div>
                          <span class="om-badge om-badge--neutral text-[10px]"

                    <label class="text-xs text-surface-600 dark:text-surface-300">
                      env_prefix:
                      <input type="text" x-model="editor.env_prefix"
                             class="ml-1 px-2 py-1 text-xs rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono w-32" />
                    </label>
                    <button class="om-btn om-btn--ghost om-btn--sm" @click="refreshSnapshot()" :disabled="snapshot.state === 'loading'">Apply</button>
                  </div>
                </div>
                <template x-if="snapshot.state === 'loading'">
                  <p class="text-sm text-surface-500 dark:text-surface-400 italic">Loading…</p>
                </template>
                <template x-if="snapshot.state === 'error'">
                  <p class="text-sm text-danger-700 dark:text-danger-500" x-text="snapshot.error"></p>
                </template>
                <template x-if="snapshot.state === 'loaded' && profilesList().length === 0">
                  <p class="text-sm text-surface-500 dark:text-surface-400 italic">No profiles configured.</p>
                </template>
                <template x-if="snapshot.state === 'loaded' && profilesList().length > 0">
                  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                    <template x-for="p in profilesList()" :key="p.name">
                      <button type="button" class="text-left p-3 rounded-md border transition"
                              :class="p.name === editor.profile ? 'border-primary-500 bg-primary-50/60 dark:bg-primary-900/30' : 'border-surface-200 dark:border-surface-700 hover:border-primary-300'"
                              @click="selectProfile(p.name)">
                        <div class="flex items-center justify-between gap-2">
                          <div class="min-w-0">
                            <p class="text-sm font-semibold" x-text="p.title || p.name"></p>
                            <p class="text-[10px] font-mono text-surface-500 dark:text-surface-400" x-text="p.name"></p>
                          </div>
                          <span class="om-badge text-[10px]" :class="'om-badge--' + profileTone(p.status)"
                                x-text="(p.status && (p.status.state || p.status.status)) || '—'"></span>
                        </div>
                      </button>
                    </template>
                  </div>
                </template>
                <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline mt-3"
                        @click="showRaw.snapshot = !showRaw.snapshot">
                  <span x-show="!showRaw.snapshot">show raw</span><span x-show="showRaw.snapshot">hide raw</span>
                </button>
                <pre x-show="showRaw.snapshot" x-cloak class="mt-2 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-60 overflow-auto" x-text="snapshot.raw"></pre>
              </section>

              <!-- YAML editor -->
              <section class="om-card">
                <div class="flex items-center justify-between mb-3 gap-2 flex-wrap">
                  <div class="flex items-center gap-2">
                    <h2 class="text-base font-semibold">Editor</h2>
                    <span class="om-badge om-badge--neutral text-[10px]" x-text="editor.profile || 'no profile selected'"></span>
                  </div>
                  <div class="flex items-center gap-2">
                    <button class="om-btn om-btn--ghost om-btn--sm" @click="submitValidate()" :disabled="validateResult.state === 'loading' || !editor.profile">
                      <span x-show="validateResult.state !== 'loading'">Validate</span>
                      <span x-show="validateResult.state === 'loading'">Validating…</span>
                    </button>
                    <button class="om-btn om-btn--primary om-btn--sm" @click="openSaveDialog()" :disabled="!editor.profile">
                      <span x-html="omIcon('upload-cloud', 'w-3.5 h-3.5')"></span><span>Save…</span>
                    </button>
                  </div>
                </div>
                <p class="text-sm text-surface-600 dark:text-surface-300 mb-3">
                  Editing the raw YAML for <span class="font-mono text-xs" x-text="(snapshot.data && snapshot.data.path) || '<config-path>'"></span>. Validation parses the candidate without touching disk; save rewrites it.
                </p>
                <textarea x-model="editor.content" rows="12" spellcheck="false"
                          placeholder="profiles:&#10;  default:&#10;    OPENAI_API_KEY: secret://openai-key&#10;    TELEGRAM_BOT_TOKEN: secret://telegram-bot-token"
                          class="w-full px-3 py-2 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs"></textarea>

                <template x-if="validateResult.state === 'error'">
                  <p class="mt-3 text-sm text-danger-700 dark:text-danger-500" x-text="validateResult.error"></p>
                </template>
                <template x-if="validateResult.state === 'loaded'">
                  <div class="mt-3 text-sm flex items-center gap-2">
                    <span class="text-surface-500 dark:text-surface-400">Validation:</span>
                    <span class="om-badge"
                          :class="'om-badge--' + (validateConfigured() === true ? 'success' : validateConfigured() === false ? 'warning' : 'neutral')"
                          x-text="validateConfigured() === true ? 'configured' : validateConfigured() === false ? 'incomplete' : 'parsed'"></span>
                  </div>
                </template>
                <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline mt-2"
                        @click="showRaw.validateResult = !showRaw.validateResult">
                  <span x-show="!showRaw.validateResult">show raw</span><span x-show="showRaw.validateResult">hide raw</span>
                </button>
                <pre x-show="showRaw.validateResult" x-cloak class="mt-2 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-60 overflow-auto" x-text="validateResult.raw"></pre>

                <template x-if="saveResult.state === 'loaded' && saveResult.data">
                  <div class="mt-4 p-3 rounded-md border text-sm space-y-1"
                       :class="saveRestartRequired() ? 'border-warning-500/40 bg-warning-500/10' : 'border-success-500/40 bg-success-500/10'">
                    <p class="font-semibold flex items-center gap-2">
                      <span class="om-badge" :class="'om-badge--' + (saveRestartRequired() ? 'warning' : 'success')"
                            x-text="saveRestartRequired() ? 'saved · restart required' : 'saved'"></span>
                      <span class="text-surface-500 dark:text-surface-400 text-xs font-normal" x-text="saveResult.data.profile ? 'profile: ' + saveResult.data.profile : ''"></span>
                    </p>
                    <p class="text-xs text-surface-600 dark:text-surface-300" x-show="saveRestartRequired()">
                      The save succeeded but the profile needs a restart to pick the new mapping. Schedule it manually.
                    </p>
                  </div>
                </template>
                <template x-if="saveResult.state === 'error'">
                  <p class="mt-3 text-sm text-danger-700 dark:text-danger-500" x-text="saveResult.error"></p>
                </template>
                <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline mt-2"
                        @click="showRaw.saveResult = !showRaw.saveResult">
                  <span x-show="!showRaw.saveResult">show raw</span><span x-show="showRaw.saveResult">hide raw</span>
                </button>
                <pre x-show="showRaw.saveResult" x-cloak class="mt-2 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-60 overflow-auto" x-text="saveResult.raw"></pre>
              </section>

              <!-- save modal -->
              <div x-data="omModalFor('secrets-wizard-save')" x-show="open" x-cloak class="om-modal-overlay" @click.self="close()">
                <div class="om-modal" role="dialog" aria-modal="true" aria-labelledby="secrets-wizard-save-title">
                  <div class="om-modal__header">
                    <h3 id="secrets-wizard-save-title" class="text-base font-semibold">Save secret-reference profile</h3>
                    <button class="om-btn om-btn--ghost om-btn--sm" @click="close()" aria-label="Close">
                      <span x-html="omIcon('x', 'w-4 h-4')"></span>
                    </button>
                  </div>
                  <div class="om-modal__body space-y-3 text-sm">
                    <p class="text-surface-600 dark:text-surface-300">
                      About to rewrite the on-disk YAML for profile <span class="font-mono text-xs" x-text="editor.profile"></span>. The audit trail records this action.
                    </p>
                    <label class="block">
                      <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Actor</span>
                      <input type="text" x-model="saveForm.actor"
                             class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs" />
                    </label>
                    <label class="inline-flex items-center gap-2 text-sm">
                      <input type="checkbox" x-model="saveForm.reload_after_save" />
                      <span>Attempt live reload after save</span>
                    </label>
                    <div x-show="saveForm.error" class="text-xs text-danger-700 dark:text-danger-500 bg-danger-500/10 rounded-md px-2 py-1.5" x-text="saveForm.error"></div>
                  </div>
                  <div class="om-modal__footer">
                    <button class="om-btn om-btn--ghost" @click="close()" :disabled="saveForm.busy">Cancel</button>
                    <button class="om-btn om-btn--primary" @click="submitSave()" :disabled="saveForm.busy">
                      <span x-show="!saveForm.busy">Save</span>
                      <span x-show="saveForm.busy">Saving…</span>
                    </button>
                  </div>
                </div>
              </div>

            </div>
          </template>
        </div>
      </template>

      <!-- ===== DISPATCHES ===== -->
      <template x-if="activeId === 'dispatches'">
        <div class="max-w-6xl mx-auto px-6 py-8 space-y-6" x-data="adminDispatches()" x-init="init()">

          <header class="flex items-start justify-between gap-4 flex-wrap">
            <div>
              <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">Operate</p>
              <h1 class="text-2xl font-semibold tracking-tight">Dispatches</h1>
              <p class="mt-1 text-sm text-surface-600 dark:text-surface-300">
                OpenClaw dispatch records across runtimes. Click a row to inspect its full timeline and act on it: <strong>cancel</strong> aborts a pending dispatch, <strong>retry</strong> re-enqueues with optional overrides, <strong>reconcile</strong> manually pins a canonical status (escape hatch when retry/cancel cannot untangle a half-applied state).
              </p>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs text-surface-500 dark:text-surface-400" x-show="lastRefreshAt"
                    x-text="lastRefreshAt ? 'updated ' + lastRefreshAt.toLocaleTimeString() : ''"></span>
              <button class="om-btn om-btn--ghost om-btn--sm" @click="refresh()" :disabled="list.state === 'loading'">
                <span x-html="omIcon('arrow-up-down', 'w-3.5 h-3.5')"></span><span>Refresh</span>
              </button>
            </div>
          </header>

          <template x-if="!omAuth.state.token">
            <div class="om-card text-center py-12">
              <div class="mx-auto w-12 h-12 rounded-full bg-warning-500/15 text-warning-700 dark:text-warning-500 flex items-center justify-center mb-3"
                   x-html="omIcon('key', 'w-6 h-6')"></div>
              <h2 class="text-base font-semibold mb-1">Connect to load dispatches</h2>
              <p class="text-sm text-surface-600 dark:text-surface-300">Use the auth dropdown in the topbar.</p>
            </div>
          </template>

          <template x-if="omAuth.state.token">
            <div class="space-y-6">

              <!-- filters -->
              <section class="om-card">
                <div class="flex items-center justify-between mb-3 gap-2 flex-wrap">
                  <h2 class="text-base font-semibold">Filters</h2>
                  <span class="text-[10px] font-mono text-surface-500 dark:text-surface-400">GET /admin/openclaw/dispatches</span>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3 text-sm">
                  <label class="block">
                    <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Runtime id</span>
                    <input type="text" x-model="filters.runtime_id" placeholder="(any)"
                           class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs" />
                  </label>
                  <label class="block">
                    <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Action</span>
                    <input type="text" x-model="filters.action" placeholder="(any)"
                           class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs" />
                  </label>
                  <label class="block">
                    <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Status</span>
                    <input type="text" x-model="filters.status" placeholder="(any)"
                           class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs" />
                  </label>
                  <label class="block">
                    <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Limit</span>
                    <input type="number" min="1" max="300" x-model.number="filters.limit"
                           class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs" />
                  </label>
                </div>
                <div class="mt-3">
                  <button class="om-btn om-btn--ghost om-btn--sm" @click="refresh()">Apply</button>
                </div>
              </section>

              <!-- list -->
              <section class="om-card">
                <div class="flex items-center justify-between mb-3 gap-2">
                  <h2 class="text-base font-semibold">Dispatches
                    <span class="om-badge om-badge--neutral ml-2" x-text="itemsList().length"></span>
                  </h2>
                  <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline"
                          @click="showRaw.list = !showRaw.list">
                    <span x-show="!showRaw.list">show raw</span><span x-show="showRaw.list">hide raw</span>
                  </button>
                </div>
                <template x-if="list.state === 'loading'">
                  <p class="text-sm text-surface-500 dark:text-surface-400 italic">Loading…</p>
                </template>
                <template x-if="list.state === 'error'">
                  <p class="text-sm text-danger-700 dark:text-danger-500" x-text="list.error"></p>
                </template>
                <template x-if="isEmpty()">
                  <p class="text-sm text-surface-500 dark:text-surface-400 italic">No dispatches match the filters.</p>
                </template>
                <template x-if="list.state === 'loaded' && itemsList().length > 0">
                  <div class="overflow-x-auto">
                    <table class="om-table om-table--compact">
                      <thead>
                        <tr>
                          <th>Dispatch id</th>
                          <th>Runtime</th>
                          <th>Action</th>
                          <th>Status</th>
                          <th>Updated</th>
                          <th></th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="d in itemsList()" :key="d.dispatch_id || d.id">
                          <tr :class="(d.dispatch_id || d.id) === selectedId ? 'bg-primary-50/60 dark:bg-primary-900/30' : ''">
                            <td class="font-mono text-xs">
                              <button type="button" class="text-left hover:underline"
                                      @click="select(d.dispatch_id || d.id)">
                                <span x-text="d.dispatch_id || d.id || '—'"></span>
                              </button>
                            </td>
                            <td class="font-mono text-xs" x-text="d.runtime_id || '—'"></td>
                            <td class="font-mono text-xs" x-text="d.action || '—'"></td>
                            <td>
                              <span class="om-badge text-[10px]"
                                    :class="'om-badge--' + statusTone(d.canonical_status || d.status)"
                                    x-text="d.canonical_status || d.status || '—'"></span>
                            </td>
                            <td class="text-xs whitespace-nowrap" x-text="d.updated_at || d.ts || '—'"></td>
                            <td class="flex items-center gap-1 flex-wrap">
                              <button class="om-btn om-btn--ghost om-btn--sm"
                                      @click="openActionDialog(d.dispatch_id || d.id, 'cancel')">Cancel</button>
                              <button class="om-btn om-btn--ghost om-btn--sm"
                                      @click="openActionDialog(d.dispatch_id || d.id, 'retry')">Retry</button>
                              <button class="om-btn om-btn--danger om-btn--sm"
                                      @click="openActionDialog(d.dispatch_id || d.id, 'reconcile')">Reconcile</button>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>
                <pre x-show="showRaw.list" x-cloak class="mt-3 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-60 overflow-auto" x-text="list.raw"></pre>
              </section>

              <!-- detail -->
              <template x-if="selectedId">
                <section class="om-card">
                  <div class="flex items-center justify-between mb-3 gap-2 flex-wrap">
                    <div>
                      <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Selected dispatch</p>
                      <h2 class="text-base font-semibold font-mono mt-0.5" x-text="selectedId"></h2>
                    </div>
                    <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline"
                            @click="showRaw.detail = !showRaw.detail">
                      <span x-show="!showRaw.detail">show raw</span><span x-show="showRaw.detail">hide raw</span>
                    </button>
                  </div>
                  <template x-if="detail.state === 'loading'">
                    <p class="text-sm text-surface-500 dark:text-surface-400 italic">Loading…</p>
                  </template>
                  <template x-if="detail.state === 'error'">
                    <p class="text-sm text-danger-700 dark:text-danger-500" x-text="detail.error"></p>
                  </template>
                  <template x-if="detail.state === 'loaded'">
                    <details class="text-sm">
                      <summary class="cursor-pointer text-surface-700 dark:text-surface-200 select-none">Dispatch payload</summary>
                      <pre class="mt-2 text-[11px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-72 overflow-auto" x-text="JSON.stringify(detail.data, null, 2)"></pre>
                    </details>
                  </template>
                  <pre x-show="showRaw.detail" x-cloak class="mt-3 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-60 overflow-auto" x-text="detail.raw"></pre>
                </section>
              </template>

              <!-- last action result -->
              <template x-if="actionResult.state === 'loaded' || actionResult.state === 'error'">
                <section class="om-card">
                  <h2 class="text-base font-semibold mb-2">Last action</h2>
                  <template x-if="actionResult.state === 'error'">
                    <p class="text-sm text-danger-700 dark:text-danger-500" x-text="actionResult.error"></p>
                  </template>
                  <template x-if="actionResult.state === 'loaded'">
                    <p class="text-sm flex items-center gap-2">
                      <span class="om-badge om-badge--success">applied</span>
                      <span class="text-xs text-surface-500 dark:text-surface-400"
                            x-text="actionResult.data && actionResult.data.dispatch ? ('canonical_status: ' + (actionResult.data.dispatch.canonical_status || '—')) : ''"></span>
                    </p>
                  </template>
                  <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline mt-2"
                          @click="showRaw.actionResult = !showRaw.actionResult">
                    <span x-show="!showRaw.actionResult">show raw</span><span x-show="showRaw.actionResult">hide raw</span>
                  </button>
                  <pre x-show="showRaw.actionResult" x-cloak class="mt-2 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-60 overflow-auto" x-text="actionResult.raw"></pre>
                </section>
              </template>

              <!-- action modal -->
              <div x-data="omModalFor('dispatches-action')" x-show="open" x-cloak class="om-modal-overlay" @click.self="close()">
                <div class="om-modal" role="dialog" aria-modal="true" aria-labelledby="dispatches-action-title">
                  <div class="om-modal__header">
                    <h3 id="dispatches-action-title" class="text-base font-semibold">Confirm dispatch action</h3>
                    <button class="om-btn om-btn--ghost om-btn--sm" @click="close()" aria-label="Close">
                      <span x-html="omIcon('x', 'w-4 h-4')"></span>
                    </button>
                  </div>
                  <div class="om-modal__body space-y-3 text-sm">
                    <p class="text-surface-600 dark:text-surface-300">
                      About to <span class="font-semibold" x-text="actionForm.action"></span> dispatch <span class="font-mono text-xs" x-text="actionForm.dispatch_id"></span>.
                    </p>
                    <label class="block" x-show="actionForm.action === 'reconcile'">
                      <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Target status *</span>
                      <input type="text" x-model="actionForm.target_status" placeholder="e.g. succeeded, failed"
                             class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs" />
                    </label>
                    <label class="block">
                      <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Reason *</span>
                      <textarea x-model="actionForm.reason" rows="3" spellcheck="true"
                                placeholder="What did you observe? (auditor reads this later)"
                                class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 text-sm"></textarea>
                    </label>
                    <label class="block">
                      <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Actor</span>
                      <input type="text" x-model="actionForm.actor"
                             class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 font-mono text-xs" />
                    </label>
                    <div x-show="actionForm.error" class="text-xs text-danger-700 dark:text-danger-500 bg-danger-500/10 rounded-md px-2 py-1.5" x-text="actionForm.error"></div>
                  </div>
                  <div class="om-modal__footer">
                    <button class="om-btn om-btn--ghost" @click="close()" :disabled="actionForm.busy">Cancel</button>
                    <button class="om-btn om-btn--primary" @click="submitAction()" :disabled="actionForm.busy">
                      <span x-show="!actionForm.busy">Confirm</span>
                      <span x-show="actionForm.busy">Submitting…</span>
                    </button>
                  </div>
                </div>
              </div>

            </div>
          </template>
        </div>
      </template>

      <!-- ===== Remaining admin sections (still placeholders) ===== -->
      <template x-if="activeId !== 'dashboard' && activeId !== 'runtimes' && activeId !== 'policies' && activeId !== 'secrets' && activeId !== 'identities' && activeId !== 'channels' && activeId !== 'evidence' && activeId !== 'secrets-wizard' && activeId !== 'dispatches'">
        <div class="max-w-5xl mx-auto px-6 py-8">
          <header>
            <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">
              <span x-text="groups.find(g => g.items.some(i => i.id === activeId))?.title || ''"></span>
            </p>
            <h1 class="text-2xl font-semibold tracking-tight" x-text="groups.flatMap(g => g.items).find(i => i.id === activeId)?.label || activeId"></h1>
            <p class="mt-2 text-sm text-surface-600 dark:text-surface-300 max-w-2xl">
              Nine functional admin surfaces shipped. The remaining sidebar items (<strong>Approvals</strong>, <strong>Workflows</strong>, <strong>System &amp; config</strong>, <strong>Event log</strong>, <strong>Tool calls</strong>) are reserved for a follow-up sprint.
            </p>
          </header>
        </div>
      </template>

    </main>

  </div>


  <div x-data="omToastTray()" class="om-toast-tray" aria-live="polite" aria-atomic="false">
    <template x-for="t in items" :key="t.id">
      <div class="om-toast" :class="'om-toast--' + t.type" role="status">
        <span class="shrink-0 mt-0.5"
              :class="t.type === 'success' ? 'text-success-500'
                    : t.type === 'warning' ? 'text-warning-500'
                    : t.type === 'danger'  ? 'text-danger-500'
                    : 'text-info-500'"
              x-html="omIcon(iconFor(t.type), 'w-4 h-4')"></span>
        <div class="flex-1 min-w-0" x-text="t.message"></div>
        <button class="text-surface-400 hover:text-surface-700 dark:hover:text-surface-200 shrink-0" @click="dismiss(t.id)" aria-label="Dismiss">
          <span x-html="omIcon('x', 'w-4 h-4')"></span>
        </button>
      </div>
    </template>
  </div>
</body>
</html>
