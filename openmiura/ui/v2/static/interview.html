<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>openMiura — Interview demo</title>
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/JetBrains/JetBrainsMono@v2.304/web/jetbrains-mono.css" />
  <link rel="stylesheet" href="./openmiura.css" />
  <script src="./js/theme.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/icons.js"></script>
  <script src="./js/components.js"></script>
  <script src="./js/shell.js"></script>
  <script src="./js/interview/demo.js"></script>
  <script defer src="./js/alpine.min.js"></script>
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="font-sans" x-data="omShell({
  profile: 'interview',
  activeId: 'overview',
  breadcrumbs: [
    { label: 'Interview demo' }
  ]
})">

  <div class="om-shell">

    <aside class="om-sidebar bg-surface-0 dark:bg-surface-900 border-r border-surface-200 dark:border-surface-700 flex flex-col"
           :class="{ 'hidden md:flex': !mobileMenuOpen, 'flex': mobileMenuOpen }">
      <div class="px-4 py-4 border-b border-surface-200 dark:border-surface-700 flex items-center gap-3">
        <div class="w-8 h-8 rounded-md bg-primary-900 dark:bg-primary-700 flex items-center justify-center text-surface-0 font-bold text-sm">oM</div>
        <div class="min-w-0">
          <p class="text-sm font-semibold tracking-tight truncate" x-text="profileTitle"></p>
          <p class="text-xs text-surface-500 dark:text-surface-400 truncate" x-text="profileTagline"></p>
        </div>
      </div>

      <nav class="flex-1 overflow-y-auto py-3 space-y-4" aria-label="Interview demo sections">
        <template x-for="group in groups" :key="group.title">
          <div :aria-labelledby="'group-' + group.title">
            <p :id="'group-' + group.title"
               class="px-4 mb-1 text-[10px] font-semibold uppercase tracking-wider text-surface-500 dark:text-surface-400" x-text="group.title"></p>
            <ul>
              <template x-for="item in group.items" :key="item.id">
                <li>
                  <button type="button"
                          class="w-full flex items-center gap-2 px-4 py-2 text-sm transition text-left"
                          :class="isActive(item.id)
                            ? 'bg-primary-50 dark:bg-primary-900/40 text-primary-900 dark:text-accent-300 font-medium border-l-2 border-primary-900 dark:border-accent-400'
                            : 'text-surface-700 dark:text-surface-300 hover:bg-surface-100 dark:hover:bg-surface-800 border-l-2 border-transparent'"
                          :aria-current="isActive(item.id) ? 'page' : 'false'"
                          @click="setActive(item.id)">
                    <span x-html="omIcon(item.icon, 'w-4 h-4 shrink-0')" aria-hidden="true"></span>
                    <span x-text="item.label" class="truncate"></span>
                  </button>
                </li>
              </template>
            </ul>
          </div>
        </template>
      </nav>

      <div class="px-4 py-3 border-t border-surface-200 dark:border-surface-700 text-xs text-surface-500 dark:text-surface-400">
        <p>openMiura UI v2</p>
        <p class="font-mono">phase/ui-a2</p>
      </div>
    </aside>

    <header class="om-topbar bg-surface-0 dark:bg-surface-900 border-b border-surface-200 dark:border-surface-700 flex items-center px-4 gap-3">
      <button type="button"
              class="md:hidden p-1.5 rounded-md text-surface-700 dark:text-surface-200 hover:bg-surface-100 dark:hover:bg-surface-800"
              @click="toggleMobileMenu()" aria-label="Toggle menu">
        <span class="block w-5 h-0.5 bg-current mb-1"></span>
        <span class="block w-5 h-0.5 bg-current mb-1"></span>
        <span class="block w-5 h-0.5 bg-current"></span>
      </button>

      <nav aria-label="Breadcrumb" class="flex-1 overflow-x-auto min-w-0">
        <ol class="flex items-center gap-2 text-sm whitespace-nowrap">
          <template x-for="(crumb, i) in breadcrumbs" :key="i">
            <li class="flex items-center gap-2">
              <span x-show="i > 0" class="text-surface-400 dark:text-surface-600">/</span>
              <span class="text-surface-700 dark:text-surface-200 font-medium" x-text="crumb.label"></span>
            </li>
          </template>
        </ol>
      </nav>

      <div class="relative" x-data="omAuthPanel()">
        <button type="button"
                class="inline-flex items-center gap-2 px-2 py-1 rounded-md text-xs font-medium border border-surface-300 dark:border-surface-600 text-surface-700 dark:text-surface-200 hover:bg-surface-100 dark:hover:bg-surface-800 transition"
                @click="toggle()" :aria-expanded="open ? 'true' : 'false'">
          <span class="inline-block w-2 h-2 rounded-full"
                :class="status === 'connected' ? 'bg-success-500' : status === 'error' ? 'bg-danger-500' : status === 'connecting' ? 'bg-warning-500' : 'bg-surface-400'"></span>
          <span class="max-w-[180px] truncate" x-text="(me && (me.username || me.principal_id || me.user_key)) || (token ? 'token set' : 'not authenticated')"></span>
          <span class="text-surface-500 dark:text-surface-400 text-[10px]" x-text="open ? '▴' : '▾'"></span>
        </button>
        <div x-show="open" x-cloak @click.outside="close()" x-transition.opacity.duration.150ms
             class="absolute right-0 mt-2 w-80 om-card z-40 space-y-3 shadow-xl">
          <div>
            <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">Broker base URL</p>
            <input type="url" x-model="baseUrl"
                   class="w-full px-2 py-1.5 text-sm rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 text-surface-900 dark:text-surface-100"
                   placeholder="http://127.0.0.1:8081/broker" />
          </div>
          <div>
            <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">Auth mode</p>
            <div class="flex gap-1">
              <button type="button" class="flex-1 px-2 py-1 text-xs rounded-md transition"
                      :class="mode === 'token' ? 'bg-primary-900 text-surface-0 dark:bg-primary-700' : 'border border-surface-300 dark:border-surface-600 text-surface-700 dark:text-surface-200'"
                      @click="mode = 'token'">Static token</button>
              <button type="button" class="flex-1 px-2 py-1 text-xs rounded-md transition"
                      :class="mode === 'login' ? 'bg-primary-900 text-surface-0 dark:bg-primary-700' : 'border border-surface-300 dark:border-surface-600 text-surface-700 dark:text-surface-200'"
                      @click="mode = 'login'">Username + password</button>
            </div>
          </div>
          <div x-show="mode === 'token'" class="space-y-1">
            <label class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Token</label>
            <input type="password" x-model="token"
                   class="w-full px-2 py-1.5 text-sm font-mono rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 text-surface-900 dark:text-surface-100"
                   placeholder="Broker or session token" />
          </div>
          <div x-show="mode === 'login'" class="space-y-2">
            <div>
              <label class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Username</label>
              <input type="text" x-model="username" autocomplete="username"
                     class="w-full px-2 py-1.5 text-sm rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 text-surface-900 dark:text-surface-100"
                     placeholder="admin" />
            </div>
            <div>
              <label class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Password</label>
              <input type="password" x-model="password" autocomplete="current-password"
                     class="w-full px-2 py-1.5 text-sm rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 text-surface-900 dark:text-surface-100"
                     placeholder="••••••••" />
            </div>
          </div>
          <div class="flex gap-2 pt-1">
            <button type="button" class="flex-1 px-3 py-1.5 text-sm rounded-md bg-primary-900 text-surface-0 hover:bg-primary-800 disabled:opacity-50 disabled:cursor-not-allowed transition"
                    :disabled="busy" @click="connect()">
              <span x-show="!busy">Connect</span>
              <span x-show="busy">Connecting…</span>
            </button>
            <button type="button" class="px-3 py-1.5 text-sm rounded-md border border-surface-300 dark:border-surface-600 text-surface-700 dark:text-surface-200 hover:bg-surface-100 dark:hover:bg-surface-800 disabled:opacity-50 transition"
                    :disabled="busy || !token" @click="disconnect()">Disconnect</button>
          </div>
          <div x-show="error" class="text-xs text-danger-700 dark:text-danger-500 bg-danger-500/10 rounded-md px-2 py-1.5" x-text="error"></div>
          <div x-show="me" class="text-xs text-surface-600 dark:text-surface-300 border-t border-surface-200 dark:border-surface-700 pt-2 space-y-0.5">
            <p>Authenticated as <span class="font-mono" x-text="me && (me.username || me.principal_id || me.user_key)"></span></p>
            <p>Role: <span class="font-mono" x-text="me && (me.role || me.auth_mode || '—')"></span></p>
          </div>
        </div>
      </div>

      <button type="button"
              class="p-1.5 rounded-md text-surface-700 dark:text-surface-200 hover:bg-surface-100 dark:hover:bg-surface-800"
              @click="toggleTheme()" :aria-label="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'">
        <span x-show="theme === 'dark'" class="text-base">☀</span>
        <span x-show="theme === 'light'" class="text-base">☾</span>
      </button>
    </header>

    <main class="om-main bg-surface-50 dark:bg-surface-950 overflow-y-auto">

      <!-- ===== OVERVIEW ===== -->
      <template x-if="activeId === 'overview'">
        <div class="max-w-4xl mx-auto px-6 py-8 space-y-6" x-data="interviewOverview()">
          <header>
            <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">openMiura, in 5 minutes</p>
            <h1 class="text-2xl font-semibold tracking-tight">What is this product?</h1>
            <p class="mt-2 text-sm text-surface-600 dark:text-surface-300 max-w-2xl">
              openMiura is the governance plane between an LLM agent and the
              systems it touches. We do not run the agent. We <em>audit</em>,
              <em>gate</em>, and <em>sign</em> every action the agent takes,
              so a regulated lab (GxP / GMP / Part 11) can defend the
              decisions later.
            </p>
            <p class="mt-2 text-xs text-surface-500 dark:text-surface-400 max-w-2xl">
              This page is a demo. No backend calls. Pick <strong>Walkthrough</strong> to see the
              canonical NMR-review flow step by step, or <strong>Evidence inspector</strong> to see
              what a signed audit pack looks like.
            </p>
          </header>

          <section class="space-y-3">
            <template x-for="p in pillars" :key="p.id">
              <button type="button"
                      class="om-card w-full text-left transition"
                      :class="p.open ? 'border-l-4 border-accent-500' : ''"
                      @click="togglePillar(p.id)">
                <div class="flex items-start gap-3">
                  <span class="shrink-0 w-9 h-9 rounded-md bg-accent-100 dark:bg-accent-900/30 text-accent-700 dark:text-accent-300 flex items-center justify-center"
                        x-html="omIcon(p.icon, 'w-5 h-5')"></span>
                  <div class="min-w-0 flex-1">
                    <p class="text-sm font-semibold flex items-center justify-between gap-2">
                      <span x-text="p.title"></span>
                      <span class="text-surface-500 dark:text-surface-400 text-xs" x-text="p.open ? '−' : '+'"></span>
                    </p>
                    <p class="mt-1 text-sm text-surface-600 dark:text-surface-300"
                       x-show="p.open" x-cloak
                       x-text="p.summary"></p>
                  </div>
                </div>
              </button>
            </template>
          </section>

          <section>
            <a class="text-sm text-accent-700 dark:text-accent-300 hover:underline" href="./admin.html">Admin console →</a>
            ·
            <a class="text-sm text-accent-700 dark:text-accent-300 hover:underline" href="./science.html">Science workspace →</a>
          </section>
        </div>
      </template>

      <!-- ===== WALKTHROUGH ===== -->
      <template x-if="activeId === 'walkthrough'">
        <div class="max-w-4xl mx-auto px-6 py-8 space-y-6" x-data="interviewWalkthrough()" x-init="init()">
          <header class="flex items-start justify-between gap-4 flex-wrap">
            <div>
              <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">Demo</p>
              <h1 class="text-2xl font-semibold tracking-tight">Canonical walkthrough</h1>
              <p class="mt-1 text-sm text-surface-600 dark:text-surface-300 max-w-2xl">
                A scientist at UAL processes an NMR spectrum with the agent.
                Each step shows what openMiura logged. Arrow keys ←→ to navigate.
              </p>
            </div>
            <div class="flex items-center gap-2">
              <button class="om-btn om-btn--ghost om-btn--sm" @click="toggleAutoplay()">
                <span x-show="!autoplay" x-html="omIcon('play-circle', 'w-3.5 h-3.5')"></span>
                <span x-show="autoplay">⏸</span>
                <span x-text="autoplay ? 'Pause' : 'Auto-advance'"></span>
              </button>
            </div>
          </header>

          <!-- progress -->
          <section class="om-card">
            <div class="flex items-center justify-between mb-2 gap-2">
              <p class="text-xs text-surface-500 dark:text-surface-400">
                <span>Step</span>
                <span class="font-mono" x-text="(currentIdx + 1) + ' / ' + steps.length"></span>
              </p>
              <p class="text-xs text-surface-500 dark:text-surface-400" x-text="progress() + '%'"></p>
            </div>
            <div class="h-1.5 rounded bg-surface-200 dark:bg-surface-700 overflow-hidden">
              <div class="h-full bg-accent-500 transition-all" :style="'width:' + progress() + '%'"></div>
            </div>

            <!-- step chips -->
            <div class="flex flex-wrap gap-2 mt-3">
              <template x-for="(s, i) in steps" :key="s.id">
                <button type="button"
                        class="px-2 py-1 text-[10px] font-mono rounded-md border transition"
                        :class="i === currentIdx
                          ? 'border-accent-500 text-accent-700 dark:text-accent-300 bg-accent-50 dark:bg-accent-900/30'
                          : 'border-surface-300 dark:border-surface-600 text-surface-600 dark:text-surface-300 hover:border-accent-300'"
                        @click="goto(i)">
                  <span x-text="(i + 1) + '. ' + s.id"></span>
                </button>
              </template>
            </div>
          </section>

          <!-- current step -->
          <section class="om-card" x-show="currentStep()">
            <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">Step <span x-text="currentIdx + 1"></span></p>
            <h2 class="text-xl font-semibold tracking-tight" x-text="currentStep().title"></h2>
            <p class="mt-2 text-sm text-surface-700 dark:text-surface-200" x-text="currentStep().lede"></p>

            <pre class="mt-4 text-[11px] font-mono p-3 rounded bg-surface-100 dark:bg-surface-800 overflow-x-auto"
                 x-text="(currentStep().detail || []).join('\n')"></pre>

            <div class="mt-4 flex items-center justify-between gap-2">
              <button class="om-btn om-btn--ghost om-btn--sm" @click="prev()" :disabled="isFirst()">← Previous</button>
              <button class="om-btn om-btn--primary om-btn--sm" @click="next()" :disabled="isLast()">Next →</button>
            </div>
          </section>
        </div>
      </template>

      <!-- ===== EVIDENCE INSPECTOR ===== -->
      <template x-if="activeId === 'evidence'">
        <div class="max-w-5xl mx-auto px-6 py-8 space-y-6" x-data="interviewEvidence()">
          <header>
            <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">Demo</p>
            <h1 class="text-2xl font-semibold tracking-tight">Evidence inspector</h1>
            <p class="mt-1 text-sm text-surface-600 dark:text-surface-300 max-w-2xl">
              What a signed compliance export looks like once an auditor pulls it. Synthetic data — every field matches the shape of what the live compliance export endpoint returns.
            </p>
          </header>

          <!-- pack header -->
          <section class="om-card">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
              <div>
                <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Artifact ref</p>
                <p class="font-mono text-xs mt-0.5 break-all" x-text="pack.artifact_ref"></p>
              </div>
              <div>
                <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Report label</p>
                <p class="font-mono text-xs mt-0.5" x-text="pack.report_label"></p>
              </div>
              <div>
                <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Generated at</p>
                <p class="font-mono text-xs mt-0.5" x-text="pack.generated_at"></p>
              </div>
              <div>
                <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Actor</p>
                <p class="font-mono text-xs mt-0.5" x-text="pack.actor"></p>
              </div>
            </div>
            <div class="mt-3 text-xs text-surface-600 dark:text-surface-300">
              Scope:
              <span class="font-mono"
                    x-text="pack.scope.tenant_id + ' / ' + pack.scope.workspace_id + ' / ' + pack.scope.environment"></span>
            </div>
          </section>

          <!-- sections -->
          <section class="om-card">
            <h2 class="text-base font-semibold mb-3">Sections</h2>
            <div class="space-y-2">
              <template x-for="key in sectionKeys()" :key="key">
                <div class="border border-surface-200 dark:border-surface-700 rounded-md">
                  <button type="button"
                          class="w-full flex items-center justify-between gap-2 px-3 py-2 text-sm text-left"
                          @click="toggleSection(key)">
                    <span class="font-mono text-xs" x-text="key.replace(/_/g, ' ')"></span>
                    <span class="flex items-center gap-2">
                      <span class="om-badge om-badge--neutral text-[10px]" x-text="sectionCount(key) ?? '—'"></span>
                      <span class="text-surface-500 dark:text-surface-400 text-xs"
                            x-text="expandedSections[key] ? '−' : '+'"></span>
                    </span>
                  </button>
                  <div x-show="expandedSections[key]" x-cloak class="px-3 pb-3">
                    <template x-if="sectionItems(key).length === 0">
                      <p class="text-xs text-surface-500 dark:text-surface-400 italic">(no items in this section)</p>
                    </template>
                    <template x-if="sectionItems(key).length > 0">
                      <ul class="space-y-1 text-xs font-mono">
                        <template x-for="(it, i) in sectionItems(key)" :key="i">
                          <li class="px-2 py-1 rounded bg-surface-50 dark:bg-surface-800 overflow-x-auto"
                              x-text="JSON.stringify(it)"></li>
                        </template>
                      </ul>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </section>

          <!-- signature -->
          <section class="om-card">
            <h2 class="text-base font-semibold mb-3 flex items-center gap-2">
              <span x-html="omIcon('shield-check', 'w-4 h-4')"></span>
              <span>Signature</span>
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs font-mono">
              <div>
                <p class="text-[10px] uppercase tracking-wider text-surface-500 dark:text-surface-400">Algorithm</p>
                <p x-text="pack.signature.algorithm"></p>
              </div>
              <div>
                <p class="text-[10px] uppercase tracking-wider text-surface-500 dark:text-surface-400">Public key</p>
                <p class="break-all" x-text="pack.signature.public_key"></p>
              </div>
              <div>
                <p class="text-[10px] uppercase tracking-wider text-surface-500 dark:text-surface-400">Signed at</p>
                <p x-text="pack.signature.signed_at"></p>
              </div>
              <div>
                <p class="text-[10px] uppercase tracking-wider text-surface-500 dark:text-surface-400">Digest sha256</p>
                <p class="break-all" x-text="pack.signature.digest_sha256"></p>
              </div>
            </div>
            <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline mt-3"
                    @click="showRaw = !showRaw">
              <span x-show="!showRaw">show raw JSON</span><span x-show="showRaw">hide raw</span>
            </button>
            <pre x-show="showRaw" x-cloak class="mt-2 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-80 overflow-auto" x-text="rawJson()"></pre>
          </section>
        </div>
      </template>

      <!-- ===== Fallback ===== -->
      <template x-if="activeId !== 'overview' && activeId !== 'walkthrough' && activeId !== 'evidence'">
        <div class="max-w-4xl mx-auto px-6 py-8">
          <h1 class="text-2xl font-semibold tracking-tight">Pick a demo section</h1>
          <p class="mt-2 text-sm text-surface-600 dark:text-surface-300">
            All three interview views are wired up. Pick one in the sidebar.
          </p>
        </div>
      </template>

    </main>

  </div>


  <div x-data="omToastTray()" class="om-toast-tray" aria-live="polite" aria-atomic="false">
    <template x-for="t in items" :key="t.id">
      <div class="om-toast" :class="'om-toast--' + t.type" role="status">
        <span class="shrink-0 mt-0.5"
              :class="t.type === 'success' ? 'text-success-500'
                    : t.type === 'warning' ? 'text-warning-500'
                    : t.type === 'danger'  ? 'text-danger-500'
                    : 'text-info-500'"
              x-html="omIcon(iconFor(t.type), 'w-4 h-4')"></span>
        <div class="flex-1 min-w-0" x-text="t.message"></div>
        <button class="text-surface-400 hover:text-surface-700 dark:hover:text-surface-200 shrink-0" @click="dismiss(t.id)" aria-label="Dismiss">
          <span x-html="omIcon('x', 'w-4 h-4')"></span>
        </button>
      </div>
    </template>
  </div>
</body>
</html>
