<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>openMiura — Science workspace</title>
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/JetBrains/JetBrainsMono@v2.304/web/jetbrains-mono.css" />
  <link rel="stylesheet" href="./openmiura.css" />
  <script src="./js/theme.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/icons.js"></script>
  <script src="./js/components.js"></script>
  <script src="./js/shell.js"></script>
  <script src="./js/science/chat.js"></script>
  <script src="./js/science/nmr_asdf.js"></script>
  <script src="./js/science/nmr_csv.js"></script>
  <script src="./js/science/nmr.js"></script>
  <script src="./js/science/nmr_vendor.js"></script>
  <script src="./js/science/upload.js"></script>
  <script src="./js/science/review.js"></script>
  <script src="./js/science/approvals.js"></script>
  <script src="./js/science/history.js"></script>
  <script defer src="./js/alpine.min.js"></script>
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="font-sans" x-data="omShell({
  profile: 'science',
  activeId: 'chat',
  breadcrumbs: [
    { label: 'Science', href: './science.html' },
    { label: 'Chat with agent' }
  ]
})">

  <div class="om-shell">

    <aside class="om-sidebar bg-surface-0 dark:bg-surface-900 border-r border-surface-200 dark:border-surface-700 flex flex-col"
           :class="{ 'hidden md:flex': !mobileMenuOpen, 'flex': mobileMenuOpen }">
      <div class="px-4 py-4 border-b border-surface-200 dark:border-surface-700 flex items-center gap-3">
        <div class="w-8 h-8 rounded-md bg-primary-900 dark:bg-primary-700 flex items-center justify-center text-surface-0 font-bold text-sm">oM</div>
        <div class="min-w-0">
          <p class="text-sm font-semibold tracking-tight truncate" x-text="profileTitle"></p>
          <p class="text-xs text-surface-500 dark:text-surface-400 truncate" x-text="profileTagline"></p>
        </div>
      </div>

      <nav class="flex-1 overflow-y-auto py-3 space-y-4" aria-label="Science workspace sections">
        <template x-for="group in groups" :key="group.title">
          <div :aria-labelledby="'group-' + group.title">
            <p :id="'group-' + group.title"
               class="px-4 mb-1 text-[10px] font-semibold uppercase tracking-wider text-surface-500 dark:text-surface-400" x-text="group.title"></p>
            <ul>
              <template x-for="item in group.items" :key="item.id">
                <li>
                  <button type="button"
                          class="w-full flex items-center gap-2 px-4 py-2 text-sm transition text-left"
                          :class="isActive(item.id)
                            ? 'bg-primary-50 dark:bg-primary-900/40 text-primary-900 dark:text-accent-300 font-medium border-l-2 border-primary-900 dark:border-accent-400'
                            : 'text-surface-700 dark:text-surface-300 hover:bg-surface-100 dark:hover:bg-surface-800 border-l-2 border-transparent'"
                          :aria-current="isActive(item.id) ? 'page' : 'false'"
                          @click="setActive(item.id)">
                    <span x-html="omIcon(item.icon, 'w-4 h-4 shrink-0')" aria-hidden="true"></span>
                    <span x-text="item.label" class="truncate"></span>
                  </button>
                </li>
              </template>
            </ul>
          </div>
        </template>
      </nav>

      <div class="px-4 py-3 border-t border-surface-200 dark:border-surface-700 text-xs text-surface-500 dark:text-surface-400">
        <p>openMiura UI v2</p>
        <p class="font-mono">phase/ui-a2</p>
      </div>
    </aside>

    <header class="om-topbar bg-surface-0 dark:bg-surface-900 border-b border-surface-200 dark:border-surface-700 flex items-center px-4 gap-3">
      <button type="button"
              class="md:hidden p-1.5 rounded-md text-surface-700 dark:text-surface-200 hover:bg-surface-100 dark:hover:bg-surface-800"
              @click="toggleMobileMenu()" aria-label="Toggle menu">
        <span class="block w-5 h-0.5 bg-current mb-1"></span>
        <span class="block w-5 h-0.5 bg-current mb-1"></span>
        <span class="block w-5 h-0.5 bg-current"></span>
      </button>

      <nav aria-label="Breadcrumb" class="flex-1 overflow-x-auto min-w-0">
        <ol class="flex items-center gap-2 text-sm whitespace-nowrap">
          <template x-for="(crumb, i) in breadcrumbs" :key="i">
            <li class="flex items-center gap-2">
              <span x-show="i > 0" class="text-surface-400 dark:text-surface-600">/</span>
              <template x-if="crumb.href">
                <a :href="crumb.href" class="text-accent-700 dark:text-accent-300 hover:underline" x-text="crumb.label"></a>
              </template>
              <template x-if="!crumb.href">
                <span class="text-surface-700 dark:text-surface-200" :class="i === breadcrumbs.length - 1 ? 'font-medium' : ''" x-text="crumb.label"></span>
              </template>
            </li>
          </template>
        </ol>
      </nav>

      <div class="relative" x-data="omAuthPanel()">
        <button type="button"
                class="inline-flex items-center gap-2 px-2 py-1 rounded-md text-xs font-medium border border-surface-300 dark:border-surface-600 text-surface-700 dark:text-surface-200 hover:bg-surface-100 dark:hover:bg-surface-800 transition"
                @click="toggle()" :aria-expanded="open ? 'true' : 'false'">
          <span class="inline-block w-2 h-2 rounded-full"
                :class="status === 'connected' ? 'bg-success-500' : status === 'error' ? 'bg-danger-500' : status === 'connecting' ? 'bg-warning-500' : 'bg-surface-400'"></span>
          <span class="max-w-[180px] truncate" x-text="(me && (me.username || me.principal_id || me.user_key)) || (token ? 'token set' : 'not authenticated')"></span>
          <span class="text-surface-500 dark:text-surface-400 text-[10px]" x-text="open ? '▴' : '▾'"></span>
        </button>
        <div x-show="open" x-cloak @click.outside="close()" x-transition.opacity.duration.150ms
             class="absolute right-0 mt-2 w-80 om-card z-40 space-y-3 shadow-xl">
          <div>
            <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">Broker base URL</p>
            <input type="url" x-model="baseUrl"
                   class="w-full px-2 py-1.5 text-sm rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 text-surface-900 dark:text-surface-100"
                   placeholder="http://127.0.0.1:8081/broker" />
          </div>
          <div>
            <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">Auth mode</p>
            <div class="flex gap-1">
              <button type="button" class="flex-1 px-2 py-1 text-xs rounded-md transition"
                      :class="mode === 'token' ? 'bg-primary-900 text-surface-0 dark:bg-primary-700' : 'border border-surface-300 dark:border-surface-600 text-surface-700 dark:text-surface-200'"
                      @click="mode = 'token'">Static token</button>
              <button type="button" class="flex-1 px-2 py-1 text-xs rounded-md transition"
                      :class="mode === 'login' ? 'bg-primary-900 text-surface-0 dark:bg-primary-700' : 'border border-surface-300 dark:border-surface-600 text-surface-700 dark:text-surface-200'"
                      @click="mode = 'login'">Username + password</button>
            </div>
          </div>
          <div x-show="mode === 'token'" class="space-y-1">
            <label class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Token</label>
            <input type="password" x-model="token"
                   class="w-full px-2 py-1.5 text-sm font-mono rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 text-surface-900 dark:text-surface-100"
                   placeholder="Broker or session token" />
          </div>
          <div x-show="mode === 'login'" class="space-y-2">
            <div>
              <label class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Username</label>
              <input type="text" x-model="username" autocomplete="username"
                     class="w-full px-2 py-1.5 text-sm rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 text-surface-900 dark:text-surface-100"
                     placeholder="admin" />
            </div>
            <div>
              <label class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Password</label>
              <input type="password" x-model="password" autocomplete="current-password"
                     class="w-full px-2 py-1.5 text-sm rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 text-surface-900 dark:text-surface-100"
                     placeholder="••••••••" />
            </div>
          </div>
          <div class="flex gap-2 pt-1">
            <button type="button" class="flex-1 px-3 py-1.5 text-sm rounded-md bg-primary-900 text-surface-0 hover:bg-primary-800 disabled:opacity-50 disabled:cursor-not-allowed transition"
                    :disabled="busy" @click="connect()">
              <span x-show="!busy">Connect</span>
              <span x-show="busy">Connecting…</span>
            </button>
            <button type="button" class="px-3 py-1.5 text-sm rounded-md border border-surface-300 dark:border-surface-600 text-surface-700 dark:text-surface-200 hover:bg-surface-100 dark:hover:bg-surface-800 disabled:opacity-50 transition"
                    :disabled="busy || !token" @click="disconnect()">Disconnect</button>
          </div>
          <div x-show="error" class="text-xs text-danger-700 dark:text-danger-500 bg-danger-500/10 rounded-md px-2 py-1.5" x-text="error"></div>
          <div x-show="me" class="text-xs text-surface-600 dark:text-surface-300 border-t border-surface-200 dark:border-surface-700 pt-2 space-y-0.5">
            <p>Authenticated as <span class="font-mono" x-text="me && (me.username || me.principal_id || me.user_key)"></span></p>
            <p>Role: <span class="font-mono" x-text="me && (me.role || me.auth_mode || '—')"></span></p>
          </div>
        </div>
      </div>

      <button type="button"
              class="p-1.5 rounded-md text-surface-700 dark:text-surface-200 hover:bg-surface-100 dark:hover:bg-surface-800"
              @click="toggleTheme()" :aria-label="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'">
        <span x-show="theme === 'dark'" class="text-base">☀</span>
        <span x-show="theme === 'light'" class="text-base">☾</span>
      </button>
    </header>

    <main class="om-main bg-surface-50 dark:bg-surface-950 overflow-y-auto">

      <!-- ===== CHAT WITH AGENT ===== -->
      <template x-if="activeId === 'chat'">
        <div class="max-w-4xl mx-auto px-6 py-8 space-y-6" x-data="scienceChat()" x-init="init()">

          <header class="flex items-start justify-between gap-4 flex-wrap">
            <div>
              <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">Workspace</p>
              <h1 class="text-2xl font-semibold tracking-tight">Chat with agent</h1>
              <p class="mt-1 text-sm text-surface-600 dark:text-surface-300">
                Conversation thread with the configured science agent. Persisted in your browser until you reset; each turn is sent through <span class="font-mono text-xs">POST /http/message</span> and audited on the backend.
              </p>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs text-surface-500 dark:text-surface-400" x-show="sessionId"
                    x-text="'session: ' + sessionId.slice(0, 12) + '…'"></span>
              <button class="om-btn om-btn--ghost om-btn--sm" @click="reset()" :disabled="composer.busy">
                <span x-html="omIcon('x', 'w-3.5 h-3.5')"></span><span>New conversation</span>
              </button>
            </div>
          </header>

          <!-- empty / not-authed -->
          <template x-if="!authenticated()">
            <div class="om-card text-center py-12">
              <div class="mx-auto w-12 h-12 rounded-full bg-warning-500/15 text-warning-700 dark:text-warning-500 flex items-center justify-center mb-3"
                   x-html="omIcon('key', 'w-6 h-6')"></div>
              <h2 class="text-base font-semibold mb-1">Connect to chat with the agent</h2>
              <p class="text-sm text-surface-600 dark:text-surface-300">Use the auth dropdown in the topbar.</p>
            </div>
          </template>

          <template x-if="authenticated()">
            <div class="space-y-4">

              <!-- transcript -->
              <section class="om-card">
                <template x-if="isEmpty()">
                  <p class="text-sm text-surface-500 dark:text-surface-400 italic py-8 text-center">
                    No messages yet. Type your first question below to start the conversation.
                  </p>
                </template>

                <template x-if="!isEmpty()">
                  <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-1">
                    <template x-for="(m, i) in messages" :key="i">
                      <article class="flex gap-3"
                               :class="m.role === 'user' ? 'flex-row-reverse' : ''">
                        <div class="shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-[10px] font-semibold"
                             :class="m.role === 'user' ? 'bg-primary-100 dark:bg-primary-900/40 text-primary-900 dark:text-accent-300'
                                   : m.role === 'agent' ? 'bg-accent-100 dark:bg-accent-900/30 text-accent-700 dark:text-accent-300'
                                   : 'bg-surface-100 dark:bg-surface-800 text-surface-500'"
                             x-text="m.role === 'user' ? 'you' : m.role === 'agent' ? 'AI' : 'sys'"></div>
                        <div class="min-w-0 max-w-[80%] space-y-1"
                             :class="m.role === 'user' ? 'text-right' : ''">
                          <p class="text-[10px] uppercase tracking-wider text-surface-500 dark:text-surface-400 flex items-center gap-2 flex-wrap"
                             :class="m.role === 'user' ? 'justify-end' : ''">
                            <span x-text="(m.role === 'agent' && m.agent_id ? m.agent_id + ' · ' : '') + (m.ts ? new Date(m.ts).toLocaleTimeString() : '')"></span>
                            <!-- H1.6: streaming mode badge for the agent turn -->
                            <span x-show="m.role === 'agent' && m.streaming_mode"
                                  class="om-badge text-[9px] font-mono"
                                  :class="m.streaming_mode === 'native' ? 'om-badge--success' : 'om-badge--neutral'"
                                  x-text="m.streaming_mode"></span>
                          </p>

                          <!-- H1.6: tool-event activity timeline (native streaming only) -->
                          <template x-if="m.role === 'agent' && m.tool_events && m.tool_events.length > 0">
                            <ul class="space-y-1 text-[11px]">
                              <template x-for="(te, ti) in m.tool_events" :key="ti">
                                <li class="flex items-start gap-2">
                                  <span class="om-badge text-[9px] font-mono shrink-0"
                                        :class="te.kind === 'call' ? 'om-badge--info'
                                              : te.kind === 'result' && te.error ? 'om-badge--danger'
                                              : 'om-badge--success'"
                                        x-text="te.kind === 'call' ? '→ ' + (te.name || 'tool') : '✓ ' + (te.name || 'tool')"></span>
                                  <span class="text-surface-600 dark:text-surface-400 font-mono break-words"
                                        x-text="te.kind === 'call'
                                                  ? JSON.stringify(te.arguments || {})
                                                  : (te.error ? ('error: ' + te.error) : truncateOutput(te.output, 200))"></span>
                                </li>
                              </template>
                            </ul>
                          </template>

                          <div class="inline-block text-left text-sm rounded-md px-3 py-2 whitespace-pre-wrap break-words"
                               :class="m.role === 'user' ? 'bg-primary-50 dark:bg-primary-900/20 text-surface-900 dark:text-surface-100'
                                     : m.role === 'agent' ? 'bg-surface-100 dark:bg-surface-800 text-surface-900 dark:text-surface-100'
                                     : (m.error ? 'bg-danger-500/10 text-danger-700 dark:text-danger-500 italic'
                                                : 'bg-surface-100 dark:bg-surface-800 text-surface-700 dark:text-surface-300 italic')"
                               x-text="m.text"></div>
                        </div>
                      </article>
                    </template>
                    <template x-if="composer.busy">
                      <article class="flex gap-3">
                        <div class="shrink-0 w-8 h-8 rounded-full bg-accent-100 dark:bg-accent-900/30 text-accent-700 dark:text-accent-300 flex items-center justify-center text-[10px] font-semibold">AI</div>
                        <div class="text-sm text-surface-500 dark:text-surface-400 italic">thinking…</div>
                      </article>
                    </template>
                  </div>
                </template>
              </section>

              <!-- composer -->
              <section class="om-card">
                <label class="block">
                  <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Your message</span>
                  <textarea x-model="composer.text" rows="3" spellcheck="true"
                            placeholder="Ask the agent — e.g. 'Process the NMR file I uploaded yesterday and draft the assignment.'"
                            class="mt-1 w-full px-3 py-2 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 text-sm"
                            @keydown.ctrl.enter.prevent="send()"
                            @keydown.meta.enter.prevent="send()"></textarea>
                </label>
                <div class="mt-2 flex items-center justify-between gap-2 flex-wrap">
                  <div class="flex items-center gap-3">
                    <span class="text-[10px] text-surface-500 dark:text-surface-400">Ctrl/⌘ + Enter to send</span>
                    <label class="inline-flex items-center gap-1 text-[10px] text-surface-500 dark:text-surface-400 cursor-pointer">
                      <input type="checkbox" x-model="streamingEnabled" class="cursor-pointer" />
                      <span>stream</span>
                    </label>
                  </div>
                  <div class="flex items-center gap-2">
                    <button class="om-btn om-btn--ghost om-btn--sm" @click="showRaw = !showRaw" :disabled="!lastTurnRaw">
                      <span x-show="!showRaw">show last response raw</span><span x-show="showRaw">hide raw</span>
                    </button>
                    <button class="om-btn om-btn--primary om-btn--sm" @click="send()" :disabled="composer.busy || !composer.text.trim()">
                      <span x-show="!composer.busy">Send</span>
                      <span x-show="composer.busy">Sending…</span>
                    </button>
                  </div>
                </div>
                <div x-show="error" class="mt-3 text-xs text-danger-700 dark:text-danger-500 bg-danger-500/10 rounded-md px-2 py-1.5" x-text="error"></div>
                <pre x-show="showRaw && lastTurnRaw" x-cloak class="mt-3 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-60 overflow-auto" x-text="lastTurnRaw"></pre>
              </section>
            </div>
          </template>

        </div>
      </template>

      <!-- ===== UPLOAD SPECTRUM ===== -->
      <template x-if="activeId === 'upload'">
        <div class="max-w-4xl mx-auto px-6 py-8 space-y-6" x-data="scienceUpload()" x-init="init()">

          <header>
            <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">Workspace</p>
            <h1 class="text-2xl font-semibold tracking-tight">Upload spectrum</h1>
            <p class="mt-1 text-sm text-surface-600 dark:text-surface-300">
              Stage instrument files (NMR spectra, mass-spec runs, raw exports) and discuss them with the agent. Files stay in your browser — the staging area persists name, size and a <span class="font-mono text-xs">sha256</span> so you and the agent agree on identity later. The bytes themselves are never spilled into localStorage.
            </p>
          </header>

          <!-- drop zone -->
          <section class="om-card">
            <div class="p-6 rounded-md border-2 border-dashed transition cursor-pointer text-center"
                 :class="dragging ? 'border-primary-500 bg-primary-50/40 dark:bg-primary-900/30' : 'border-surface-300 dark:border-surface-600'"
                 @dragover.prevent="onDragOver($event)"
                 @dragleave.prevent="onDragLeave()"
                 @drop.prevent="onDrop($event)"
                 @click="$refs.fileInput.click()">
              <div class="mx-auto w-12 h-12 rounded-full bg-surface-100 dark:bg-surface-800 text-surface-500 flex items-center justify-center mb-3"
                   x-html="omIcon('upload-cloud', 'w-6 h-6')"></div>
              <p class="text-sm font-semibold">Drop a file here or click to pick</p>
              <p class="text-xs text-surface-500 dark:text-surface-400 mt-1">
                Up to 50 MiB per file · 20 files max · stored client-side
              </p>
              <input type="file" multiple class="hidden" x-ref="fileInput" @change="onFileInput($event)" />
            </div>
            <div x-show="progress.busy" class="mt-3 text-xs text-surface-500 dark:text-surface-400">
              <span x-text="progress.step"></span>: <span class="font-mono" x-text="progress.name"></span>
            </div>
            <div x-show="error" class="mt-3 text-xs text-danger-700 dark:text-danger-500 bg-danger-500/10 rounded-md px-2 py-1.5" x-text="error"></div>
          </section>

          <!-- staged list -->
          <section class="om-card">
            <div class="flex items-center justify-between mb-3 gap-2 flex-wrap">
              <h2 class="text-base font-semibold">Staged files
                <span class="om-badge om-badge--neutral ml-2" x-text="stagedCount()"></span>
              </h2>
              <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline"
                      @click="clearAll()" x-show="!isEmpty()">Clear all</button>
            </div>

            <template x-if="isEmpty()">
              <p class="text-sm text-surface-500 dark:text-surface-400 italic">Nothing staged yet. Drag a file above to begin.</p>
            </template>

            <template x-if="!isEmpty()">
              <ul class="space-y-3">
                <template x-for="entry in staged" :key="entry.id">
                  <li class="border border-surface-200 dark:border-surface-700 rounded-md p-3 text-sm">
                    <div class="flex items-start justify-between gap-3 flex-wrap">
                      <div class="min-w-0 flex-1">
                        <p class="font-mono text-xs truncate" x-text="entry.name"></p>
                        <p class="text-[10px] text-surface-500 dark:text-surface-400">
                          <span x-text="formatBytes(entry.size)"></span> ·
                          <span class="font-mono" x-text="entry.mime"></span> ·
                          <span class="font-mono" x-text="entry.ts"></span>
                        </p>
                        <p class="text-[10px] font-mono text-surface-500 dark:text-surface-400 mt-1 break-all"
                           x-text="'sha256: ' + (entry.sha256 || '(unavailable)')"></p>
                      </div>
                      <div class="flex items-center gap-2 flex-wrap">
                        <span class="om-badge text-[10px]"
                              :class="entry.uploaded ? 'om-badge--success' : entry.discussed ? 'om-badge--info' : 'om-badge--neutral'"
                              x-text="entry.uploaded ? 'uploaded' : entry.discussed ? 'sent to agent' : 'staged'"></span>
                        <span x-show="entry.server_upload_id"
                              class="om-badge om-badge--neutral text-[10px] font-mono"
                              x-text="entry.server_upload_id ? 'id:' + entry.server_upload_id.slice(0,8) : ''"></span>
                        <button class="om-btn om-btn--ghost om-btn--sm" @click="removeStaged(entry.id)">Remove</button>
                        <button class="om-btn om-btn--ghost om-btn--sm"
                                @click="openPreview(entry.id)"
                                x-show="looksLikeSpectrum(entry)"
                                :title="'Preview as NMR spectrum (JCAMP-DX)'">
                          <span x-html="omIcon('file-search', 'w-3.5 h-3.5')"></span><span>View</span>
                        </button>
                        <button class="om-btn om-btn--ghost om-btn--sm"
                                @click="uploadToServer(entry.id)"
                                :disabled="uploadingId === entry.id || entry.uploaded || !authenticated() || !hasFileInMemory(entry.id)"
                                :title="!hasFileInMemory(entry.id) ? 'Bytes not in memory (re-drop the file)' : ''">
                          <span x-show="!entry.uploaded && uploadingId !== entry.id">Upload to server</span>
                          <span x-show="entry.uploaded">Uploaded ✓</span>
                          <span x-show="uploadingId === entry.id">Uploading…</span>
                        </button>
                        <button class="om-btn om-btn--primary om-btn--sm"
                                @click="discuss(entry.id)"
                                :disabled="sendingId === entry.id || !authenticated()">
                          <span x-show="sendingId !== entry.id">Discuss with agent</span>
                          <span x-show="sendingId === entry.id">Sending…</span>
                        </button>
                      </div>
                    </div>
                  </li>
                </template>
              </ul>
            </template>

            <div x-show="sendError" class="mt-3 text-xs text-danger-700 dark:text-danger-500 bg-danger-500/10 rounded-md px-2 py-1.5" x-text="sendError"></div>
            <div x-show="uploadError" class="mt-3 text-xs text-danger-700 dark:text-danger-500 bg-danger-500/10 rounded-md px-2 py-1.5" x-text="uploadError"></div>
            <p class="text-[10px] text-surface-500 dark:text-surface-400 mt-3">
              <strong>Upload to server</strong> POSTs the bytes to <span class="font-mono">/science/uploads</span> (content-addressed, sha256-deduped server-side).
              <strong>View</strong> renders JCAMP-DX 1D spectra inline (no compression).
              <strong>Discuss with agent</strong> sends a chat turn that references the staged metadata. If the file is uploaded, the agent gets the server <span class="font-mono">upload_id</span> too.
            </p>
          </section>

          <!-- G4: NMR spectrum preview modal -->
          <div x-data="omModalFor('upload-preview')" x-show="open" x-cloak class="om-modal-overlay" @click.self="close()">
            <div class="om-modal" role="dialog" aria-modal="true" aria-labelledby="upload-preview-title" style="max-width: 920px;">
              <div class="om-modal__header">
                <h3 id="upload-preview-title" class="text-base font-semibold">Spectrum preview</h3>
                <button class="om-btn om-btn--ghost om-btn--sm" @click="closePreview()" aria-label="Close">
                  <span x-html="omIcon('x', 'w-4 h-4')"></span>
                </button>
              </div>
              <div class="om-modal__body space-y-3">
                <template x-if="previewBusy">
                  <p class="text-sm text-surface-500 dark:text-surface-400 italic">Parsing JCAMP-DX…</p>
                </template>
                <template x-if="previewError">
                  <p class="text-sm text-danger-700 dark:text-danger-500 bg-danger-500/10 rounded-md px-3 py-2" x-text="previewError"></p>
                </template>
                <template x-if="previewMeta">
                  <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs font-mono">
                    <div>
                      <p class="text-[10px] uppercase tracking-wider text-surface-500 dark:text-surface-400">Title</p>
                      <p class="truncate" x-text="previewMeta.title || '—'"></p>
                    </div>
                    <div>
                      <p class="text-[10px] uppercase tracking-wider text-surface-500 dark:text-surface-400">Data type</p>
                      <p x-text="previewMeta.dataType || '—'"></p>
                    </div>
                    <div x-show="previewMeta.format">
                      <p class="text-[10px] uppercase tracking-wider text-surface-500 dark:text-surface-400">Format</p>
                      <p>
                        <span class="om-badge om-badge--neutral text-[9px]" x-text="previewMeta.format"></span>
                        <span x-show="previewMeta.vendor && previewMeta.vendor !== 'unknown'"
                              class="om-badge om-badge--info text-[9px] ml-1"
                              x-text="previewMeta.vendor_label"
                              :title="'Detected from: ' + (previewMeta.vendor_hint || 'parsed headers')"></span>
                      </p>
                    </div>
                    <div x-show="previewMeta.nuclei">
                      <p class="text-[10px] uppercase tracking-wider text-surface-500 dark:text-surface-400">Nucleus</p>
                      <p x-text="previewMeta.nuclei || '—'"></p>
                    </div>
                    <div>
                      <p class="text-[10px] uppercase tracking-wider text-surface-500 dark:text-surface-400">X range</p>
                      <p x-text="(previewMeta.firstx ?? '—') + ' → ' + (previewMeta.lastx ?? '—') + ' ' + (previewMeta.xunits || '')"></p>
                    </div>
                    <div>
                      <p class="text-[10px] uppercase tracking-wider text-surface-500 dark:text-surface-400">Points</p>
                      <p x-text="previewMeta.npoints"></p>
                    </div>
                  </div>
                </template>
                <div x-show="previewSvg" class="rounded-md border border-surface-200 dark:border-surface-700 p-2 bg-surface-0 dark:bg-surface-900 text-primary-900 dark:text-accent-300 overflow-x-auto"
                     x-html="previewSvg">
                </div>
              </div>
              <div class="om-modal__footer">
                <button class="om-btn om-btn--ghost" @click="closePreview()">Close</button>
              </div>
            </div>
          </div>

        </div>
      </template>

      <!-- ===== REVIEW DRAFTS ===== -->
      <template x-if="activeId === 'review'">
        <div class="max-w-5xl mx-auto px-6 py-8 space-y-6" x-data="scienceReview()" x-init="init()">
          <header class="flex items-start justify-between gap-4 flex-wrap">
            <div>
              <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">Workspace</p>
              <h1 class="text-2xl font-semibold tracking-tight">Review drafts</h1>
              <p class="mt-1 text-sm text-surface-600 dark:text-surface-300">
                Recent activity from the agent — sessions, tool calls, drafts — so you can spot the ones worth your attention. Read-only: act on items in <strong>Approvals</strong>.
              </p>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs text-surface-500 dark:text-surface-400" x-show="lastRefreshAt"
                    x-text="lastRefreshAt ? 'updated ' + lastRefreshAt.toLocaleTimeString() : ''"></span>
              <button class="om-btn om-btn--ghost om-btn--sm" @click="refresh()" :disabled="items.state === 'loading'">
                <span x-html="omIcon('arrow-up-down', 'w-3.5 h-3.5')"></span><span>Refresh</span>
              </button>
            </div>
          </header>

          <template x-if="!omAuth.state.token">
            <div class="om-card text-center py-12">
              <div class="mx-auto w-12 h-12 rounded-full bg-warning-500/15 text-warning-700 dark:text-warning-500 flex items-center justify-center mb-3"
                   x-html="omIcon('key', 'w-6 h-6')"></div>
              <h2 class="text-base font-semibold mb-1">Connect to load drafts</h2>
              <p class="text-sm text-surface-600 dark:text-surface-300">Use the auth dropdown in the topbar.</p>
            </div>
          </template>

          <template x-if="omAuth.state.token">
            <section class="om-card">
              <div class="flex items-center justify-between mb-3 gap-2 flex-wrap">
                <div class="flex items-center gap-2 flex-wrap">
                  <input type="text" x-model="filters.q" placeholder="filter (q)"
                         class="px-2 py-1 text-xs rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 w-40" />
                  <input type="text" x-model="filters.status" placeholder="status"
                         class="px-2 py-1 text-xs rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 w-28" />
                  <label class="inline-flex items-center gap-2 text-xs text-surface-600 dark:text-surface-300">
                    <input type="checkbox" x-model="filters.only_failures" />
                    only failures
                  </label>
                  <button class="om-btn om-btn--ghost om-btn--sm" @click="refresh()">Apply</button>
                </div>
                <span class="text-[10px] font-mono text-surface-500 dark:text-surface-400">GET /admin/operator/overview</span>
              </div>
              <template x-if="items.state === 'loading'">
                <p class="text-sm text-surface-500 dark:text-surface-400 italic">Loading…</p>
              </template>
              <template x-if="items.state === 'error'">
                <p class="text-sm text-danger-700 dark:text-danger-500" x-text="items.error"></p>
              </template>
              <template x-if="isEmpty()">
                <p class="text-sm text-surface-500 dark:text-surface-400 italic">No drafts in the current window.</p>
              </template>
              <template x-if="items.state === 'loaded' && itemsList().length > 0">
                <ul class="space-y-2 max-h-[60vh] overflow-y-auto pr-1">
                  <template x-for="(it, i) in itemsList()" :key="i">
                    <li class="border border-surface-200 dark:border-surface-700 rounded-md p-3 text-sm">
                      <div class="flex items-start justify-between gap-3 flex-wrap">
                        <div class="min-w-0 flex-1">
                          <p class="font-mono text-xs truncate" x-text="it.session_id || it.id || it.title || '(no id)'"></p>
                          <p class="text-[10px] text-surface-500 dark:text-surface-400 truncate"
                             x-text="(it.kind || '—') + ' · ' + (it.summary || it.label || it.description || '')"></p>
                          <p class="text-[10px] text-surface-500 dark:text-surface-400 mt-1"
                             x-text="(it.updated_at || it.ts || '') + (it.agent_id ? ' · ' + it.agent_id : '')"></p>
                        </div>
                        <span class="om-badge text-[10px]" :class="'om-badge--' + statusTone(it.status)"
                              x-text="it.status || '—'"></span>
                      </div>
                    </li>
                  </template>
                </ul>
              </template>
              <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline mt-3"
                      @click="showRaw = !showRaw">
                <span x-show="!showRaw">show raw</span><span x-show="showRaw">hide raw</span>
              </button>
              <pre x-show="showRaw" x-cloak class="mt-2 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-60 overflow-auto" x-text="items.raw"></pre>
            </section>
          </template>
        </div>
      </template>

      <!-- ===== APPROVALS ===== -->
      <template x-if="activeId === 'approvals'">
        <div class="max-w-5xl mx-auto px-6 py-8 space-y-6" x-data="scienceApprovals()" x-init="init()">
          <header class="flex items-start justify-between gap-4 flex-wrap">
            <div>
              <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">Governance</p>
              <h1 class="text-2xl font-semibold tracking-tight">My approvals</h1>
              <p class="mt-1 text-sm text-surface-600 dark:text-surface-300">
                Pending approvals from the operator console. Acting on one opens a confirmation modal: every decision lands on the audit trail with the reason you typed.
              </p>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs text-surface-500 dark:text-surface-400" x-show="lastRefreshAt"
                    x-text="lastRefreshAt ? 'updated ' + lastRefreshAt.toLocaleTimeString() : ''"></span>
              <button class="om-btn om-btn--ghost om-btn--sm" @click="refresh()" :disabled="items.state === 'loading'">
                <span x-html="omIcon('arrow-up-down', 'w-3.5 h-3.5')"></span><span>Refresh</span>
              </button>
            </div>
          </header>

          <template x-if="!omAuth.state.token">
            <div class="om-card text-center py-12">
              <div class="mx-auto w-12 h-12 rounded-full bg-warning-500/15 text-warning-700 dark:text-warning-500 flex items-center justify-center mb-3"
                   x-html="omIcon('key', 'w-6 h-6')"></div>
              <h2 class="text-base font-semibold mb-1">Connect to load approvals</h2>
            </div>
          </template>

          <template x-if="omAuth.state.token">
            <div class="space-y-4">
              <section class="om-card">
                <div class="flex items-center justify-between mb-3 gap-2 flex-wrap">
                  <div class="flex items-center gap-2 flex-wrap">
                    <input type="text" x-model="filters.q" placeholder="filter (q)"
                           class="px-2 py-1 text-xs rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 w-40" />
                    <select x-model="filters.status" class="px-2 py-1 text-xs rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800">
                      <option value="">any status</option>
                      <option value="pending">pending</option>
                      <option value="approved">approved</option>
                      <option value="denied">denied</option>
                    </select>
                    <button class="om-btn om-btn--ghost om-btn--sm" @click="refresh()">Apply</button>
                  </div>
                  <span class="text-[10px] font-mono text-surface-500 dark:text-surface-400">GET /admin/operator/overview?kind=approval</span>
                </div>
                <template x-if="items.state === 'loading'">
                  <p class="text-sm text-surface-500 dark:text-surface-400 italic">Loading…</p>
                </template>
                <template x-if="items.state === 'error'">
                  <p class="text-sm text-danger-700 dark:text-danger-500" x-text="items.error"></p>
                </template>
                <template x-if="isEmpty()">
                  <p class="text-sm text-surface-500 dark:text-surface-400 italic">No approvals match the current filter.</p>
                </template>
                <template x-if="items.state === 'loaded' && itemsList().length > 0">
                  <ul class="space-y-2 max-h-[60vh] overflow-y-auto pr-1">
                    <template x-for="(it, i) in itemsList()" :key="i">
                      <li class="border border-surface-200 dark:border-surface-700 rounded-md p-3 text-sm">
                        <div class="flex items-start justify-between gap-3 flex-wrap">
                          <div class="min-w-0 flex-1">
                            <p class="font-mono text-xs truncate" x-text="it.approval_id || it.id || '(no id)'"></p>
                            <p class="text-[10px] text-surface-500 dark:text-surface-400 truncate"
                               x-text="(it.kind || '—') + ' · ' + (it.summary || it.label || it.description || '')"></p>
                            <p class="text-[10px] text-surface-500 dark:text-surface-400"
                               x-text="(it.updated_at || it.ts || '') + (it.actor ? ' · ' + it.actor : '')"></p>
                          </div>
                          <div class="flex items-center gap-2">
                            <span class="om-badge om-badge--warning text-[10px]" x-text="it.status || 'pending'"></span>
                            <button class="om-btn om-btn--ghost om-btn--sm"
                                    @click="openActionDialog(it.approval_id || it.id, 'deny')"
                                    :disabled="!(it.approval_id || it.id)">Deny</button>
                            <button class="om-btn om-btn--primary om-btn--sm"
                                    @click="openActionDialog(it.approval_id || it.id, 'approve')"
                                    :disabled="!(it.approval_id || it.id)">Approve</button>
                          </div>
                        </div>
                      </li>
                    </template>
                  </ul>
                </template>
                <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline mt-3"
                        @click="showRaw = !showRaw">
                  <span x-show="!showRaw">show raw</span><span x-show="showRaw">hide raw</span>
                </button>
                <pre x-show="showRaw" x-cloak class="mt-2 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-60 overflow-auto" x-text="items.raw"></pre>
              </section>

              <!-- action modal -->
              <div x-data="omModalFor('science-approval-action')" x-show="open" x-cloak class="om-modal-overlay" @click.self="close()">
                <div class="om-modal" role="dialog" aria-modal="true" aria-labelledby="science-approval-title">
                  <div class="om-modal__header">
                    <h3 id="science-approval-title" class="text-base font-semibold">Confirm action</h3>
                    <button class="om-btn om-btn--ghost om-btn--sm" @click="close()" aria-label="Close">
                      <span x-html="omIcon('x', 'w-4 h-4')"></span>
                    </button>
                  </div>
                  <div class="om-modal__body space-y-3 text-sm">
                    <p class="text-surface-600 dark:text-surface-300">
                      About to <span class="font-semibold" x-text="actionForm.action"></span> approval <span class="font-mono text-xs" x-text="actionForm.approval_id"></span>.
                    </p>
                    <label class="block">
                      <span class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400">Reason *</span>
                      <textarea x-model="actionForm.reason" rows="3" spellcheck="true"
                                placeholder="Why are you doing this? (auditor reads this later)"
                                class="mt-1 w-full px-2 py-1.5 rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800 text-sm"></textarea>
                    </label>
                    <div x-show="actionForm.error" class="text-xs text-danger-700 dark:text-danger-500 bg-danger-500/10 rounded-md px-2 py-1.5" x-text="actionForm.error"></div>
                  </div>
                  <div class="om-modal__footer">
                    <button class="om-btn om-btn--ghost" @click="close()" :disabled="actionForm.busy">Cancel</button>
                    <button class="om-btn om-btn--primary" @click="submitAction()" :disabled="actionForm.busy">
                      <span x-show="!actionForm.busy">Confirm</span>
                      <span x-show="actionForm.busy">Submitting…</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- ===== EVIDENCE HISTORY ===== -->
      <template x-if="activeId === 'history'">
        <div class="max-w-5xl mx-auto px-6 py-8 space-y-6" x-data="scienceHistory()" x-init="init()">
          <header class="flex items-start justify-between gap-4 flex-wrap">
            <div>
              <p class="text-xs uppercase tracking-wider text-surface-500 dark:text-surface-400 mb-1">Governance</p>
              <h1 class="text-2xl font-semibold tracking-tight">My evidence</h1>
              <p class="mt-1 text-sm text-surface-600 dark:text-surface-300">
                Read-only view of the compliance summary for the active scope. To actually export a pack, drop into the admin <strong>Evidence packs</strong> view.
              </p>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs text-surface-500 dark:text-surface-400" x-show="lastRefreshAt"
                    x-text="lastRefreshAt ? 'updated ' + lastRefreshAt.toLocaleTimeString() : ''"></span>
              <button class="om-btn om-btn--ghost om-btn--sm" @click="refresh()" :disabled="summary.state === 'loading'">
                <span x-html="omIcon('arrow-up-down', 'w-3.5 h-3.5')"></span><span>Refresh</span>
              </button>
            </div>
          </header>

          <template x-if="!omAuth.state.token">
            <div class="om-card text-center py-12">
              <div class="mx-auto w-12 h-12 rounded-full bg-warning-500/15 text-warning-700 dark:text-warning-500 flex items-center justify-center mb-3"
                   x-html="omIcon('key', 'w-6 h-6')"></div>
              <h2 class="text-base font-semibold mb-1">Connect to load your evidence history</h2>
            </div>
          </template>

          <template x-if="omAuth.state.token">
            <section class="om-card">
              <div class="flex items-center justify-between mb-3 gap-2 flex-wrap">
                <div class="flex items-center gap-2 flex-wrap">
                  <label class="text-xs text-surface-600 dark:text-surface-300">
                    Window (h): <input type="number" min="1" max="720" x-model.number="filters.window_hours"
                                       class="ml-1 w-20 px-2 py-1 text-xs rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800" />
                  </label>
                  <label class="text-xs text-surface-600 dark:text-surface-300">
                    Per section: <input type="number" min="1" max="200" x-model.number="filters.limit_per_section"
                                        class="ml-1 w-20 px-2 py-1 text-xs rounded-md border border-surface-300 dark:border-surface-600 bg-surface-0 dark:bg-surface-800" />
                  </label>
                  <button class="om-btn om-btn--ghost om-btn--sm" @click="refresh()">Apply</button>
                </div>
                <span class="text-[10px] font-mono text-surface-500 dark:text-surface-400">GET /admin/compliance/summary</span>
              </div>
              <template x-if="summary.state === 'loading'">
                <p class="text-sm text-surface-500 dark:text-surface-400 italic">Loading…</p>
              </template>
              <template x-if="summary.state === 'error'">
                <p class="text-sm text-danger-700 dark:text-danger-500" x-text="summary.error"></p>
              </template>
              <template x-if="summary.state === 'loaded'">
                <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3 text-sm">
                  <template x-for="key in sectionKeys()" :key="key">
                    <div class="om-card">
                      <p class="text-[10px] uppercase tracking-wider text-surface-500 dark:text-surface-400" x-text="key.replace(/_/g, ' ')"></p>
                      <p class="text-xl font-semibold tabular-nums mt-1" x-text="sectionCount(key) ?? '—'"></p>
                    </div>
                  </template>
                </div>
              </template>
              <button class="text-[10px] font-mono text-surface-500 dark:text-surface-400 hover:underline mt-3"
                      @click="showRaw = !showRaw">
                <span x-show="!showRaw">show raw</span><span x-show="showRaw">hide raw</span>
              </button>
              <pre x-show="showRaw" x-cloak class="mt-2 text-[10px] font-mono p-2 rounded bg-surface-100 dark:bg-surface-800 max-h-80 overflow-auto" x-text="summary.raw"></pre>
            </section>
          </template>
        </div>
      </template>

      <!-- ===== Fallback (should never trigger now; kept for nav stability) ===== -->
      <template x-if="activeId !== 'chat' && activeId !== 'upload' && activeId !== 'review' && activeId !== 'approvals' && activeId !== 'history'">
        <div class="max-w-5xl mx-auto px-6 py-8 space-y-6">
          <header>
            <h1 class="text-2xl font-semibold tracking-tight">Pick a section</h1>
            <p class="mt-2 text-sm text-surface-600 dark:text-surface-300 max-w-2xl">
              All five science views are wired up. Pick one in the sidebar.
            </p>
          </header>

          <section>
            <a class="text-sm text-accent-700 dark:text-accent-300 hover:underline" href="./admin.html">Admin console →</a>
            ·
            <a class="text-sm text-accent-700 dark:text-accent-300 hover:underline" href="./interview.html">Interview demo →</a>
          </section>
        </div>
      </template>
    </main>

  </div>


  <div x-data="omToastTray()" class="om-toast-tray" aria-live="polite" aria-atomic="false">
    <template x-for="t in items" :key="t.id">
      <div class="om-toast" :class="'om-toast--' + t.type" role="status">
        <span class="shrink-0 mt-0.5"
              :class="t.type === 'success' ? 'text-success-500'
                    : t.type === 'warning' ? 'text-warning-500'
                    : t.type === 'danger'  ? 'text-danger-500'
                    : 'text-info-500'"
              x-html="omIcon(iconFor(t.type), 'w-4 h-4')"></span>
        <div class="flex-1 min-w-0" x-text="t.message"></div>
        <button class="text-surface-400 hover:text-surface-700 dark:hover:text-surface-200 shrink-0" @click="dismiss(t.id)" aria-label="Dismiss">
          <span x-html="omIcon('x', 'w-4 h-4')"></span>
        </button>
      </div>
    </template>
  </div>
</body>
</html>
