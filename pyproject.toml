[build-system]
# setuptools>=83.0.0: PYSEC-2026-3447 fixed MANIFEST.in exclude/prune
# handling, which our sdist trim (prune docs/_workjournal, docs/_archive)
# depends on. https://osv.dev/vulnerability/PYSEC-2026-3447
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmiura"
version = "1.1.0"
description = "Governed agent operations platform with releases, policies, approvals, voice, PWA and live canvas operations"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Francisco Arrabal", email = "fmarrabal@ual.es" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agents", "agent-ops", "governance", "fastapi", "ollama", "voice", "pwa", "canvas"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # fastapi 0.136.3 was withdrawn / flagged MAL-2026-4750
  # (supply-chain attack via undocumented ``fastar``
  # dependency in ``[standard]``). Pin BELOW the malicious
  # release until upstream republishes a clean version.
  "fastapi>=0.110,<0.136.3",
  # Upper caps sit one major ABOVE the latest published release at the time of
  # writing, so today's resolution is unchanged while the next breaking major
  # cannot silently alter audit-trail/signing behaviour. Bump deliberately.
  "uvicorn[standard]>=0.44.0,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.12.5,<3",
  "PyYAML>=6.0,<7",
  "click>=8.3.2,<9",
  "discord.py>=2.4,<3",
  # <50 excluded the fix for PYSEC-2026-3552 / CVE-2026-69247 (PKCS#7
  # EnvelopedData Bleichenbacher oracle, fixed in 50.0.0; openMiura does not
  # call the affected decryption path, but the audit gate rightly flags it).
  # https://osv.dev/vulnerability/PYSEC-2026-3552
  # https://github.com/pyca/cryptography/security/advisories/GHSA-g6cj-pr64-35w5
  "cryptography>=46.0.7,<51",
  # RFC 3161 trusted-timestamp parsing/verification (TimeStampToken / TSTInfo /
  # CMS). Pure-Python, MIT (Apache-2.0 compatible), no transitive deps.
  "asn1crypto>=1.5,<2",
  "prometheus-client>=0.25.0,<1",
  "mcp>=1.0,<2",
]


[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2",
]
dev = [
  "pytest>=9.0.3",
  "build>=1.4.3",
  "twine>=6.2.0",
  "pip-audit>=2.10.0",
]

[project.urls]
Homepage = "https://github.com/fmarrabal/openmiura"
Repository = "https://github.com/fmarrabal/openmiura"

[project.scripts]
openmiura = "openmiura.cli:main"

[tool.setuptools]
include-package-data = true
# Load-bearing: `openmiura run` starts the server via uvicorn.run("app:app")
# (openmiura/cli.py), so the root `app` module must ship in the wheel.
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["openmiura*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
  "unit: fast unit tests",
  "integration: integration and flow tests",
]
filterwarnings = [
  "ignore:Please use `import python_multipart` instead:PendingDeprecationWarning",
]

[tool.setuptools.package-data]
# NB: `*` does not cross directory separators in setuptools package-data —
# use `**/*` so nested assets (ui/static/icons/*, the whole ui/v2 tree the
# app mounts at /ui/v2) actually land in the wheel.
openmiura = ["builtin_skills/**/*.yaml", "builtin_skills/**/*.md", "ui/static/**/*", "ui/v2/static/**/*"]
