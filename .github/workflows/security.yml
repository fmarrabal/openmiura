name: security

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-openmiura
        with:
          python-version: "3.11"
      # PYSEC-2026-3447 / CVE-2026-59890 / GHSA-h35f-9h28-mq5c:
      # setuptools < 83.0.0 can mis-apply MANIFEST.in exclude/prune
      # semantics. The runner's bundled setuptools is part of the
      # audited environment, so upgrade it to the fixed release.
      # Verified: https://osv.dev/vulnerability/PYSEC-2026-3447 and
      # https://pypi.org/project/setuptools/83.0.0/
      - run: python -m pip install -U "setuptools>=83.0.0" pip-audit
      # PYSEC-2025-183 / CVE-2025-45768 is a disputed advisory against
      # PyJWT (key-length recommendations); upstream rejects the
      # classification and no fixed version has been released. Tracked
      # so we can drop the ignore when the advisory resolves.
      - run: pip-audit --ignore-vuln PYSEC-2025-183
      # Defense-in-depth against MAL-2026-4750. The supply-chain
      # attack route was ``fastapi[standard]==0.136.3`` pulling in
      # the undocumented ``fastar`` package. We pin fastapi
      # ``<0.136.3`` in requirements/pyproject so this should
      # already be unreachable, but a fresh assert keeps a future
      # bad un-pin from silently re-introducing the threat.
      - name: Reject malicious 'fastar' package
        run: |
          if pip show fastar >/dev/null 2>&1; then
            echo "::error::malicious package 'fastar' is installed (MAL-2026-4750 vector); refusing to continue"
            exit 1
          fi

  secret-scan:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}