name: security

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-openmiura
        with:
          python-version: "3.11"
      - run: python -m pip install pip-audit
      # PYSEC-2025-183 / CVE-2025-45768 is a disputed advisory against
      # PyJWT (key-length recommendations); upstream rejects the
      # classification and no fixed version has been released. Tracked
      # so we can drop the ignore when the advisory resolves.
      - run: pip-audit --ignore-vuln PYSEC-2025-183

  secret-scan:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}