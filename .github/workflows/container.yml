name: container

# Build the openMiura container image and publish it to the GitHub Container
# Registry (GHCR). Push happens only on a published Release or a manual
# dispatch; pull requests that touch the image build it WITHOUT pushing, as a
# regression guard for the Dockerfile.
#
# ONE-TIME OUT-OF-REPO SETUP (maintainer): none required for GHCR beyond the
# repo's built-in GITHUB_TOKEN (packages: write). After the first push, set the
# package visibility (public/private) on the ghcr.io/fmarrabal/openmiura
# package page. Recommended first run: workflow_dispatch with tag=test.

'on':
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag to push (e.g. a test tag). Optional.
        required: false
        type: string
  release:
    types:
      - published
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - pyproject.toml
      - .github/workflows/container.yml

permissions:
  contents: read

jobs:
  build-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to GHCR via the built-in GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fmarrabal/openmiura
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Push on Release / manual dispatch; PR runs are build-only smoke.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
