name: release

'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable tag to record in release artifacts and optionally publish to GitHub Release.
        required: false
        type: string
      publish_to_release:
        description: Attach official assets to an existing stable GitHub Release.
        required: false
        default: false
        type: boolean
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      stable: ${{ steps.meta.outputs.stable }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish_release: ${{ steps.meta.outputs.publish_release }}
    env:
      PYTHONHASHSEED: "0"
      SOURCE_DATE_EPOCH: "1577836800"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PUBLISH_TO_RELEASE: ${{ inputs.publish_to_release }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$EVENT_RELEASE_TAG"
            prerelease="$EVENT_RELEASE_PRERELEASE"
            publish_requested="true"
          else
            tag="$INPUT_RELEASE_TAG"
            if [[ -z "$tag" ]]; then
              tag="$GITHUB_REF_NAME"
            fi
            if [[ -z "$tag" ]]; then
              tag="v-local"
            fi
            prerelease="false"
            publish_requested="$INPUT_PUBLISH_TO_RELEASE"
          fi

          stable="false"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            stable="true"
          fi

          publish_release="false"
          if [[ "$publish_requested" == "true" && "$stable" == "true" ]]; then
            publish_release="true"
          fi

          if [[ "$EVENT_NAME" == "release" && "$prerelease" == "true" ]]; then
            publish_release="false"
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$publish_requested" == "true" && "$stable" != "true" ]]; then
            echo "Manual publication requires an explicit stable tag such as v1.0.0." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "publish_release=$publish_release" >> "$GITHUB_OUTPUT"

      - name: Check stable tag and package version alignment
        if: steps.meta.outputs.publish_release == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          python - <<'PY'
          import pathlib
          import re
          import tomllib

          root = pathlib.Path('.').resolve()
          tag = '${{ steps.meta.outputs.tag }}'
          expected = tag.removeprefix('v')

          pyproject = tomllib.loads((root / 'pyproject.toml').read_text(encoding='utf-8'))
          package_version = pyproject['project']['version']
          init_text = (root / 'openmiura' / '__init__.py').read_text(encoding='utf-8')
          match = re.search(r'__version__\s*=\s*"([^"]+)"', init_text)
          if match is None:
            raise SystemExit('Could not find __version__ in openmiura/__init__.py')
          init_version = match.group(1)

          if package_version != expected or init_version != expected:
            raise SystemExit(
                f'Stable release tag {tag} must match pyproject/openmiura package version {package_version}/{init_version}'
            )
          PY

      - name: Set up Python and install local package
        uses: ./.github/actions/setup-openmiura
        with:
          python-version: "3.11"
          extras: dev

      - name: Run release quality gate
        shell: bash
        run: |
          python scripts/run_release_quality_gate.py --include-extended --output-dir reports/quality_gate

      - name: Build release artifacts
        shell: bash
        run: |
          python scripts/build_release_artifacts.py --dist-dir dist --tag "${{ steps.meta.outputs.tag }}" --target desktop --strict

      - name: Verify release artifacts
        shell: bash
        run: |
          python scripts/verify_release_artifacts.py --dist-dir dist

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openmiura-release-${{ steps.meta.outputs.tag }}
          path: |
            dist/**
            reports/quality_gate/**

      - name: Upload official assets to GitHub Release
        if: steps.meta.outputs.publish_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/*.zip \
            dist/*.manifest.json \
            dist/RELEASE_MANIFEST.json \
            dist/SHA256SUMS.txt \
            --clobber

  # Publish the reproducible wheel + sdist to PyPI via Trusted Publishing
  # (OIDC — no long-lived token stored in the repo). This runs ONLY for a
  # published, non-prerelease, stable-tag GitHub Release, and is gated behind
  # the `pypi` Environment so a human can require approval before the upload.
  #
  # ONE-TIME OUT-OF-REPO SETUP (maintainer): create the `openmiura` project on
  # PyPI and add a Trusted Publisher pointing at repo fmarrabal/openmiura,
  # workflow `release.yml`, environment `pypi`. Until that exists this job is
  # inert (it only runs on a stable Release and would otherwise fail closed).
  publish-pypi:
    needs: build-release
    if: needs.build-release.outputs.publish_release == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # mint the OIDC token PyPI Trusted Publishing verifies
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          name: openmiura-release-${{ needs.build-release.outputs.tag }}
          path: artifacts

      - name: Collect wheel + sdist only
        shell: bash
        run: |
          mkdir -p dist-pypi
          cp artifacts/dist/*.whl dist-pypi/
          cp artifacts/dist/*.tar.gz dist-pypi/
          ls -l dist-pypi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pypi
          print-hash: true
